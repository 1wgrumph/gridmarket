<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-label="GridMarket V2 use case and outcome view">
<title>V2 use cases and outcomes</title>
<desc>Actors to nine use cases, including reading the GridMarket spec and watching market activity in Jordans 3D views, to success criteria SC-1 through SC-11.</desc>
<defs>
<marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#333333"></path></marker>
<marker id="bd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#666666"></path></marker>
</defs>
<text x="500" y="28" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111111">V2 — Use Cases and Outcomes</text>
<text x="20" y="58" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">Actors</text>
<text x="440" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">Use cases</text>
<text x="660" y="58" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">Outcomes (intent S22)</text>
<g font-family="sans-serif" font-size="12" fill="#111111">
<rect x="20" y="110" width="190" height="40" fill="#ffffff" stroke="#333333" stroke-width="1"></rect><text x="115" y="134" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111111">Human trader</text>
<rect x="20" y="170" width="190" height="40" fill="#ffffff" stroke="#333333" stroke-width="1"></rect><text x="115" y="194" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111111">Judge / developer</text>
<rect x="20" y="230" width="190" height="40" fill="#ffffff" stroke="#333333" stroke-width="1"></rect><text x="115" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111111">Seeded bots</text>
<rect x="20" y="290" width="190" height="40" fill="#ffffff" stroke="#333333" stroke-width="1"></rect><text x="115" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111111">Owner / operator</text>
<rect x="20" y="350" width="190" height="40" fill="#ffffff" stroke="#333333" stroke-width="1"></rect><text x="115" y="374" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111111">3D viewer</text>
<rect x="20" y="410" width="190" height="40" fill="#ffffff" stroke="#333333" stroke-width="1"></rect><text x="115" y="434" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">ERCOT Public API (via Worker)</text>
<rect x="20" y="470" width="190" height="40" fill="#ffffff" stroke="#333333" stroke-width="1"></rect><text x="115" y="494" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111111">NWS API (keyless)</text>
<rect x="20" y="530" width="190" height="40" fill="#ffffff" stroke="#333333" stroke-width="1"></rect><text x="115" y="554" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111111">Provider fleets</text>
</g>
<g font-family="sans-serif" font-size="12" fill="#111111">
<ellipse cx="440" cy="100" rx="150" ry="28" fill="#f2f6ff" stroke="#003399" stroke-width="1"></ellipse><text x="440" y="104" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111111">View live ERCOT signals</text>
<ellipse cx="440" cy="162" rx="150" ry="28" fill="#f2f6ff" stroke="#003399" stroke-width="1"></ellipse><text x="440" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111111">View predictions + reasons</text>
<ellipse cx="440" cy="224" rx="150" ry="28" fill="#f2f6ff" stroke="#003399" stroke-width="1"></ellipse><text x="440" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111111">Submit / cancel orders (REST)</text>
<ellipse cx="440" cy="286" rx="150" ry="28" fill="#f2f6ff" stroke="#003399" stroke-width="1"></ellipse><text x="440" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111111">Automate via public API</text>
<ellipse cx="440" cy="348" rx="150" ry="28" fill="#f2f6ff" stroke="#003399" stroke-width="1"></ellipse><text x="440" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111111">Trade across provider fleets</text>
<ellipse cx="440" cy="410" rx="150" ry="28" fill="#f2f6ff" stroke="#003399" stroke-width="1"></ellipse><text x="440" y="414" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111111">Enforce policy / risk + halts</text>
<ellipse cx="440" cy="472" rx="150" ry="28" fill="#f2f6ff" stroke="#003399" stroke-width="1"></ellipse><text x="440" y="476" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111111">Operate tunnel, keys, ledger</text>
<ellipse cx="440" cy="534" rx="150" ry="28" fill="#fff7e6" stroke="#b34700" stroke-width="1"></ellipse><text x="440" y="538" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111111">Read GridMarket spec (judge)</text>
<ellipse cx="440" cy="596" rx="150" ry="28" fill="#f5f0ff" stroke="#5b2ea6" stroke-width="1"></ellipse><text x="440" y="600" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111111">Watch activity in 3D views</text>
</g>
<g font-family="sans-serif" font-size="12" fill="#111111">
<rect x="660" y="70" width="320" height="44" fill="#eaffea" stroke="#1a7a1a" stroke-width="1"></rect><text x="672" y="88" font-family="sans-serif" font-size="12" fill="#111111">SC-1: real ERCOT data drives sim</text>
<rect x="660" y="120" width="320" height="44" fill="#eaffea" stroke="#1a7a1a" stroke-width="1"></rect><text x="672" y="138" font-family="sans-serif" font-size="12" fill="#111111">SC-2: seeded users, $1,000, trade</text>
<rect x="660" y="170" width="320" height="44" fill="#eaffea" stroke="#1a7a1a" stroke-width="1"></rect><text x="672" y="188" font-family="sans-serif" font-size="12" fill="#111111">SC-3: spot + future products work</text>
<rect x="660" y="220" width="320" height="44" fill="#eaffea" stroke="#1a7a1a" stroke-width="1"></rect><text x="672" y="238" font-family="sans-serif" font-size="12" fill="#111111">SC-4: outages/congestion shape score</text>
<rect x="660" y="270" width="320" height="44" fill="#eaffea" stroke="#1a7a1a" stroke-width="1"></rect><text x="672" y="288" font-family="sans-serif" font-size="12" fill="#111111">SC-5: predictions explain drivers</text>
<rect x="660" y="320" width="320" height="44" fill="#eaffea" stroke="#1a7a1a" stroke-width="1"></rect><text x="672" y="338" font-family="sans-serif" font-size="12" fill="#111111">SC-6: multiple provider fleets</text>
<rect x="660" y="370" width="320" height="44" fill="#eaffea" stroke="#1a7a1a" stroke-width="1"></rect><text x="672" y="388" font-family="sans-serif" font-size="12" fill="#111111">SC-7: external API clients</text>
<rect x="660" y="420" width="320" height="44" fill="#eaffea" stroke="#1a7a1a" stroke-width="1"></rect><text x="672" y="438" font-family="sans-serif" font-size="12" fill="#111111">SC-8: short example submits trade</text>
<rect x="660" y="470" width="320" height="44" fill="#eaffea" stroke="#1a7a1a" stroke-width="1"></rect><text x="672" y="488" font-family="sans-serif" font-size="12" fill="#111111">SC-9: bots use same API as humans</text>
<rect x="660" y="520" width="320" height="44" fill="#eaffea" stroke="#1a7a1a" stroke-width="1"></rect><text x="672" y="538" font-family="sans-serif" font-size="12" fill="#111111">SC-10: unsafe trades prevented</text>
<rect x="660" y="570" width="320" height="44" fill="#eaffea" stroke="#1a7a1a" stroke-width="1"></rect><text x="672" y="588" font-family="sans-serif" font-size="12" fill="#111111">SC-11: coherent UI story</text>
</g>
