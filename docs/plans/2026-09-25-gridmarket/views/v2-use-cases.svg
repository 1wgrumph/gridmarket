<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" role="img" aria-label="GridMarket V2 use case and outcome view">
<title>V2 use cases and outcomes</title>
<desc>Actors to sixteen phase-tagged use cases, including 2-click sandbox key with first order, bot observe and spawn, router checks, simulated LoneStar outage, bring-own-strategy, and guide-following agents, to success criteria SC-1 through SC-11 with SC-2 as amended.</desc>
