<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-label="GridMarket V3 operational flow view">
<title>V3 operational flow</title>
<desc>Order path through policy, risk, matching and ledger; Worker snapshot and allowlisted report polls plus NWS polls through signals, seven-factor score and predictions; router tick with market and health checks where only the heartbeat rule acts; bot loop from seeded sampler through the public API; payroll tick with deposits excluded from P and L.</desc>
<defs>
<marker id="c" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#333333"></path></marker>
<marker id="cd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#666666"></path></marker>
</defs>
<text x="500" y="28" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111111">V3 — Operational Flow</text>
<rect x="20" y="48" width="300" height="620" fill="#f2f6ff" stroke="#003399" stroke-width="2"></rect>
<text x="170" y="72" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#003399">Order path (one BEGIN IMMEDIATE txn)</text>
<rect x="340" y="48" width="300" height="620" fill="#fff7e6" stroke="#b34700" stroke-width="2"></rect>
<text x="490" y="72" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7a2e00">Signal path (Worker + NWS)</text>
<rect x="670" y="48" width="300" height="620" fill="#f5f0ff" stroke="#5b2ea6" stroke-width="2"></rect>
<text x="820" y="72" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#5b2ea6">Router tick + bots + payroll</text>
<g font-family="sans-serif" font-size="12" fill="#111111">
<rect x="30" y="90" width="280" height="56" fill="#ffffff" stroke="#003399" stroke-width="2"></rect>
<text x="170" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">1. POST /v1/orders + key</text>
<text x="170" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">+ Idempotency-Key (required)</text>
<rect x="30" y="156" width="280" height="56" fill="#ffffff" stroke="#333333" stroke-width="1"></rect>
<text x="170" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">2. Auth then rate limit</text>
<text x="170" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">no key = 401; over limit = 429</text>
<rect x="30" y="222" width="280" height="56" fill="#ffffff" stroke="#333333" stroke-width="1"></rect>
<text x="170" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">3. Idempotency check</text>
<text x="170" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">replay original; 409 if differs</text>
<rect x="30" y="288" width="280" height="66" fill="#ffffff" stroke="#b34700" stroke-width="2"></rect>
<text x="170" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">4. Halt + provider check</text>
<text x="170" y="327" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">halt = 423; offline provider:</text>
<text x="170" y="342" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">sells rejected PROVIDER_OFFLINE</text>
<rect x="30" y="364" width="280" height="66" fill="#ffffff" stroke="#b34700" stroke-width="2"></rect>
<text x="170" y="386" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">5. Risk: size, position,</text>
<text x="170" y="403" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">cash holds, capacity reserve</text>
<text x="170" y="418" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">reject if &gt; 50, &gt; 200, short cash</text>
<rect x="30" y="440" width="280" height="56" fill="#ffffff" stroke="#333333" stroke-width="1"></rect>
<text x="170" y="462" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">6. MatchingEngine</text>
<text x="170" y="480" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">price-time, resting price</text>
<rect x="30" y="506" width="280" height="66" fill="#ffffff" stroke="#333333" stroke-width="1"></rect>
<text x="170" y="528" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">7. Append-only ledger</text>
<text x="170" y="545" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">fills, settlements, positions;</text>
<text x="170" y="560" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">P&amp;L per account</text>
<rect x="30" y="582" width="280" height="56" fill="#ffffff" stroke="#1a7a1a" stroke-width="2"></rect>
<text x="170" y="604" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">8. Response + feed</text>
<text x="170" y="622" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">dashboard shows order &lt;= 5 s</text>
</g>
<g font-family="sans-serif" font-size="12" fill="#111111">
<rect x="350" y="90" width="280" height="56" fill="#ffffff" stroke="#5b2ea6" stroke-width="2"></rect>
<text x="490" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">A1. Poll /api/snapshot</text>
<text x="490" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">every 5 min; budget &lt;= 12/60 s</text>
<rect x="350" y="156" width="280" height="66" fill="#ffffff" stroke="#5b2ea6" stroke-width="2"></rect>
<text x="490" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">A2. Reports + NWS</text>
<text x="490" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">allowlisted 5/60 min;</text>
<text x="490" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">NWS keyless &lt;= 6/60 s</text>
<rect x="350" y="232" width="280" height="66" fill="#ffffff" stroke="#333333" stroke-width="1"></rect>
<text x="490" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">B. Store signals + times</text>
<text x="490" y="271" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">zone, interval, publish + fetch;</text>
<text x="490" y="286" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">fault: stale + age, stay up</text>
<rect x="350" y="308" width="280" height="66" fill="#ffffff" stroke="#333333" stroke-width="1"></rect>
<text x="490" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">C. Score 0-100 per zone-hour</text>
<text x="490" y="347" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">7 factors + LOW/MED/HIGH level</text>
<text x="490" y="362" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">spread load outage congest heat peak alert</text>
<rect x="350" y="384" width="280" height="56" fill="#ffffff" stroke="#333333" stroke-width="1"></rect>
<text x="490" y="406" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">D. Contributions</text>
<text x="490" y="424" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">signed points + one-line note</text>
<rect x="350" y="450" width="280" height="66" fill="#ffffff" stroke="#1a7a1a" stroke-width="2"></rect>
<text x="490" y="472" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">E. GET /v1/predictions</text>
<text x="490" y="489" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">dashboard polls 2 s; always:</text>
<text x="490" y="504" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">&quot;estimate, not guaranteed profit&quot;</text>
<rect x="350" y="526" width="280" height="66" fill="#ffffff" stroke="#333333" stroke-width="1"></rect>
<text x="490" y="548" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">F. FLEX cash settlement</text>
<text x="490" y="565" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">RT avg / 1000, no clamp;</text>
<text x="490" y="580" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">P&amp;L = (ref - price) x qty</text>
</g>
<g font-family="sans-serif" font-size="12" fill="#111111">
<rect x="680" y="90" width="280" height="66" fill="#ffffff" stroke="#5b2ea6" stroke-width="2"></rect>
<text x="820" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">R1. Router tick 60 s</text>
<text x="820" y="129" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">market checks: signals + score</text>
<text x="820" y="144" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">DART spread, horizon, outcome</text>
<rect x="680" y="166" width="280" height="66" fill="#ffffff" stroke="#5b2ea6" stroke-width="2"></rect>
<text x="820" y="188" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">R2. Health checks</text>
<text x="820" y="205" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">WorkerStats + heartbeats;</text>
<text x="820" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">p offline within 15 min</text>
<rect x="680" y="242" width="280" height="66" fill="#ffffff" stroke="#333333" stroke-width="1"></rect>
<text x="820" y="264" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">R3. Bands + Brier score</text>
<text x="820" y="281" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">&lt; 0.50 log; 0.50-0.80 review;</text>
<text x="820" y="296" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">0.80+ alert; Brier per check</text>
<rect x="680" y="318" width="280" height="66" fill="#ffffff" stroke="#b34700" stroke-width="2"></rect>
<text x="820" y="340" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">R4. Only heartbeat rule acts</text>
<text x="820" y="357" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">no heartbeat 30 s -&gt; offline;</text>
<text x="820" y="372" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">sells rejected PROVIDER_OFFLINE</text>
<rect x="680" y="394" width="280" height="66" fill="#ffffff" stroke="#333333" stroke-width="1"></rect>
<text x="820" y="416" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">B1. Sampler from master seed</text>
<text x="820" y="433" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">60 bots, 7 types, copula;</text>
<text x="820" y="448" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">households + economy draws</text>
<rect x="680" y="470" width="280" height="66" fill="#ffffff" stroke="#333333" stroke-width="1"></rect>
<text x="820" y="492" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">B2. Bot loop via public API</text>
<text x="820" y="509" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">bots container -&gt; SDK -&gt; API</text>
<text x="820" y="524" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">-&gt; risk -&gt; matching (&lt;= 6/min)</text>
<rect x="680" y="546" width="280" height="56" fill="#ffffff" stroke="#333333" stroke-width="1"></rect>
<text x="820" y="568" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">P1. Payroll tick 60 s</text>
<text x="820" y="586" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">deposit entries; excluded from P&amp;L</text>
<rect x="680" y="612" width="280" height="56" fill="#ffffff" stroke="#333333" stroke-width="1"></rect>
<text x="820" y="634" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111">P2. Loss statistics</text>
<text x="820" y="652" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111111">losses, net worth, dormant rate</text>
</g>
<g stroke="#333333" stroke-width="1">
<line x1="170" y1="146" x2="170" y2="154" marker-end="url(#c)"></line>
<line x1="170" y1="212" x2="170" y2="220" marker-end="url(#c)"></line>
<line x1="170" y1="278" x2="170" y2="286" marker-end="url(#c)"></line>
<line x1="170" y1="354" x2="170" y2="362" marker-end="url(#c)"></line>
<line x1="170" y1="430" x2="170" y2="438" marker-end="url(#c)"></line>
<line x1="170" y1="496" x2="170" y2="504" marker-end="url(#c)"></line>
<line x1="170" y1="572" x2="170" y2="580" marker-end="url(#c)"></line>
<line x1="490" y1="146" x2="490" y2="154" marker-end="url(#c)"></line>
<line x1="490" y1="222" x2="490" y2="230" marker-end="url(#c)"></line>
<line x1="490" y1="298" x2="490" y2="306" marker-end="url(#c)"></line>
<line x1="490" y1="374" x2="490" y2="382" marker-end="url(#c)"></line>
<line x1="490" y1="440" x2="490" y2="448" marker-end="url(#c)"></line>
<line x1="490" y1="516" x2="490" y2="524" marker-end="url(#c)"></line>
<line x1="820" y1="156" x2="820" y2="164" marker-end="url(#c)"></line>
<line x1="820" y1="232" x2="820" y2="240" marker-end="url(#c)"></line>
<line x1="820" y1="308" x2="820" y2="316" marker-end="url(#c)"></line>
<line x1="820" y1="460" x2="820" y2="468" marker-end="url(#c)"></line>
<line x1="820" y1="602" x2="820" y2="610" marker-end="url(#c)"></line>
<polyline points="630,265 665,265 665,559 632,559" fill="none" marker-end="url(#c)"></polyline>
<polyline points="680,275 645,275 645,503 678,503" fill="none" marker-end="url(#c)"></polyline>
<polyline points="310,539 338,539 338,681 968,681 968,640 962,640" fill="none" marker-end="url(#c)"></polyline>
</g>
<g stroke="#666666" stroke-width="1" stroke-dasharray="5,3">
<polyline points="350,483 330,483 330,118 308,118" fill="none" marker-end="url(#cd)"></polyline>
<polyline points="630,265 655,265 655,123 678,123" fill="none" marker-end="url(#cd)"></polyline>
<polyline points="960,351 978,351 978,700 12,700 12,321 28,321" fill="none" marker-end="url(#cd)"></polyline>
<polyline points="960,503 988,503 988,722 20,722 20,118 28,118" fill="none" marker-end="url(#cd)"></polyline>
</g>
<text x="20" y="745" font-family="sans-serif" font-size="12" fill="#111111">Dashed: E-&gt;1 traders react; B-&gt;R1 signals feed checks; R4-&gt;4 offline sells rejected; B2-&gt;1 bots enter at step 1 via public API.</text>
<text x="20" y="765" font-family="sans-serif" font-size="12" fill="#111111">Solid cross-links: B-&gt;F settlement reads stored RT prices; R3-&gt;B2 bands steer bots; O7-&gt;P2 settled positions feed loss statistics.</text>
<text x="20" y="787" font-family="sans-serif" font-size="12" fill="#111111">Note: diagram-assisted explanatory view; trace to AC-*/RISK-*/DES-*/CONTRACT-* is final per views.json.</text>
</svg>
