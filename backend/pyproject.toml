[project]
name = "gridmarket-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "pydantic", "httpx"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "diff-cover", "mutmut", "ruff", "PyYAML"]

[project.optional-dependencies]
ml = ["numpy", "scikit-learn"]
quant = ["pyqlib==0.9.7"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gridmarket_server"]

[tool.mutmut]
source_paths = ["gridmarket_server/"]
only_mutate = ["gridmarket_server/market.py", "gridmarket_server/economy.py", "gridmarket_server/decision_router.py", "gridmarket_server/health.py", "gridmarket_server/adversary.py", "gridmarket_server/ercot.py", "gridmarket_server/scoring.py"]
# The mutation target links the original tests inside mutants/ so node IDs and
# repository-relative fixture paths both resolve during collection and execution.
pytest_add_cli_args_test_selection = ["source-tests/"]

[tool.ruff]
line-length = 100
target-version = "py312"
