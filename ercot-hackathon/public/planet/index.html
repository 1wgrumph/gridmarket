<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Grid Planet · ERCOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Lexend:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{
  --sea:#6bbfb8; --sea-deep:#4fa39c; --fleck:#9fdcd5; --ink:#1f2d2e; --cream:#f3efdf; --paper:#fbf7e8;
  --mustard:#e2b53c; --mustard-dark:#b8891c; --leaf:#4f9a5c; --rose:#e39a8f; --sky:#8fd0ea; --heat:#e56f3f; --jev:#58c47a; --route:#9b83c9;
  --shadow:4px 4px 0 var(--ink);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea);color:var(--ink);font-family:Lexend,system-ui,sans-serif}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:
  radial-gradient(ellipse at 18% 30%, rgba(159,220,213,.35) 0 12%, transparent 30%),
  radial-gradient(ellipse at 82% 72%, rgba(79,163,156,.45) 0 14%, transparent 34%),
  radial-gradient(ellipse at 70% 18%, rgba(159,220,213,.25) 0 8%, transparent 22%),
  var(--sea)}
#flecks{position:absolute;inset:0;pointer-events:none}
#mount{position:absolute;inset:0;cursor:grab;touch-action:none}
#mount:active{cursor:grabbing}

/* intro */
#intro{position:absolute;inset:0;display:grid;place-items:center;z-index:30;pointer-events:none}
.title{font-family:Silkscreen,monospace;font-weight:700;color:var(--cream);text-align:center;line-height:.9;letter-spacing:.04em;
  font-size:clamp(48px,11vw,132px);text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink),6px 7px 0 rgba(31,45,46,.25)}
.title span{display:block}
.intro-sub{margin-top:14px;font-family:Silkscreen,monospace;font-size:13px;letter-spacing:.14em;color:var(--ink);text-align:center;text-transform:uppercase}
.btn{pointer-events:auto;font-family:Silkscreen,monospace;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:var(--mustard);
  border:3px solid var(--ink);box-shadow:inset 0 -5px 0 var(--mustard-dark),var(--shadow);padding:10px 26px 12px;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.btn:hover{transform:translate(-1px,-2px);box-shadow:inset 0 -5px 0 var(--mustard-dark),6px 6px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:inset 0 -3px 0 var(--mustard-dark),2px 2px 0 var(--ink)}
.btn:focus-visible,.chip:focus-visible,.tag:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.intro-stack{display:grid;justify-items:center;gap:26px}

/* hud */
.hud{position:absolute;z-index:20;opacity:0;pointer-events:none}
.ready .hud{pointer-events:auto}
.brand{top:18px;left:20px;font-family:Silkscreen,monospace;font-weight:700;color:var(--cream);font-size:26px;line-height:.95;text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.brand small{display:block;font-size:11px;font-weight:400;letter-spacing:.14em;color:var(--ink);text-shadow:none;margin-top:8px}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;background:var(--leaf);border:2px solid var(--ink);display:inline-block;animation:blink 1.6s steps(2) infinite}
.live.down i{background:var(--heat)}
@keyframes blink{50%{opacity:.3}}
.clock{top:18px;right:20px;text-align:right;font-family:Silkscreen,monospace;font-size:12px;letter-spacing:.1em;line-height:1.7}
.clock b{display:block;font-size:22px;color:var(--cream);text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.card{top:118px;right:20px;width:min(360px,calc(100vw - 40px));background:var(--paper);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:16px 16px 14px;max-height:calc(100% - 230px);overflow:auto}
.card .kind{font-family:Silkscreen,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.card h2{font-family:Silkscreen,monospace;font-size:24px;line-height:1;margin:8px 0 10px}
.card p{font-size:13.5px;line-height:1.55;margin:0 0 10px;max-width:60ch}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.stat{border:2px solid var(--ink);background:var(--cream);padding:7px 8px}
.stat .k{font-family:Silkscreen,monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.stat .v{font-size:19px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .s{font-size:11px;opacity:.75;margin-top:1px}
.stat.wide{grid-column:1/-1}
.meter{height:10px;border:2px solid var(--ink);background:var(--cream);margin-top:6px;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;display:block}
.note{font-size:11.5px;opacity:.75;margin-top:8px}
.card .close{position:absolute;top:10px;right:10px}
.dock{left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(980px,calc(100vw - 32px))}
.chip{font-family:Silkscreen,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:7px 10px 8px;cursor:pointer;display:grid;gap:2px;text-align:left;color:var(--ink);min-width:130px}
.chip .n{font-family:Lexend,sans-serif;font-weight:700;font-size:14px;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.chip.active{background:var(--mustard);box-shadow:inset 0 -4px 0 var(--mustard-dark),3px 3px 0 var(--ink)}
.chip:hover{transform:translate(-1px,-1px)}
.chip .sw{display:inline-block;width:9px;height:9px;border:2px solid var(--ink);margin-right:6px;vertical-align:-1px}
.toolbar{left:20px;bottom:100px;display:grid;gap:8px}
.toolbar .btn{font-size:11px;padding:6px 10px 8px;box-shadow:inset 0 -4px 0 var(--mustard-dark),3px 3px 0 var(--ink)}
.toolbar .btn.off{background:var(--paper);box-shadow:3px 3px 0 var(--ink)}
#tags{position:absolute;inset:0;z-index:15;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-100%);font-family:Silkscreen,monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--paper);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:3px 6px 4px;white-space:nowrap;pointer-events:auto;cursor:pointer;color:var(--ink);transition:opacity .2s}
.tag::after{content:"";position:absolute;left:50%;bottom:-8px;width:2px;height:6px;background:var(--ink);transform:translateX(-50%)}
.tag.on{background:var(--mustard)}
.legend{top:96px;left:20px;display:flex;flex-wrap:wrap;gap:6px;max-width:300px}.legend span{font-family:Silkscreen,monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);border:2px solid var(--ink);padding:2px 5px 3px;box-shadow:2px 2px 0 var(--ink)}.legend i{display:inline-block;width:8px;height:8px;border:1.5px solid var(--ink);margin-right:4px;vertical-align:-1px}
.tag b{font-family:Lexend,sans-serif;font-weight:700;letter-spacing:0;margin-left:5px}
@media (max-width:720px){
  .legend{display:none}
  .brand{font-size:18px}
  .clock{display:none}
  .card{top:auto;bottom:128px;right:12px;left:12px;width:auto;max-height:38vh}
  .dock{bottom:10px;gap:6px}
  .chip{min-width:0;flex:1 1 30%;padding:5px 6px 6px;font-size:9px}
  .chip .n{font-size:12px}
  .toolbar{display:none}
  .tag{font-size:8px}
}
.embed .card,.embed .legend,.embed .toolbar,.embed .clock{display:none!important}.embed .brand{font-size:16px;top:10px;left:12px}.embed .dock{bottom:8px;gap:5px;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:4px}.embed .chip{min-width:0!important;flex:0 0 auto!important;padding:4px 6px 5px;font-size:8px}.embed .chip .n{font-size:11px}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="flecks"></canvas>
  <div id="mount"></div>
  <div id="tags"></div>

  <div id="intro">
    <div class="intro-stack">
      <div class="title" aria-label="Grid Planet"><span>GRID</span><span>PLA</span><span>NET</span></div>
      <div class="intro-sub">ERCOT · 643 real plants · live prices, weather and help windows</div>
      <button class="btn" id="begin">Begin</button>
    </div>
  </div>

  <div class="hud brand">GRID PLANET<small><span class="live" id="live"><i></i><span id="liveText">connecting</span></span></small></div>
  <div class="hud clock"><span>Last SCED run</span><b id="sced">--:--</b><span id="lambda">λ —</span></div>
  <div class="hud legend" id="legend"></div>
  <div class="hud card" id="card"></div>
  <div class="hud toolbar">
    <button class="btn" id="spinBtn">Spin</button>
    <button class="btn" id="nightBtn">Real sky</button>
    <button class="btn" id="plantBtn">Plants</button>
  </div>
  <div class="hud dock" id="dock"></div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const qs=new URLSearchParams(location.search); const EMBED=qs.has('embed'); if(EMBED) document.getElementById('app').classList.add('embed');
const API = location.protocol==='file:' || window.__PREVIEW ? 'https://ercot-hackathon.jordan-691.workers.dev' : '';
const fmt=(n,d=0)=>n==null||!isFinite(n)?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=n=>n==null?'—':(n<0?'−$':'$')+fmt(Math.abs(n),2);
const signed=(n,d=0)=>n==null?'—':(n>0?'+':n<0?'−':'')+fmt(Math.abs(n),d);
const band=p=>p>=.8?'#58c47a':p>=.5?'#e2b53c':'#9aa5a3';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let SNAP=null, HELP=null, PLANTS=[], FLEET={wind:40234,solar:29859,storage:13264};

/* ---------- background flecks ---------- */
const fc=document.getElementById('flecks'), fx=fc.getContext('2d');
let flecks=[];
function sizeFlecks(){ fc.width=innerWidth*devicePixelRatio; fc.height=innerHeight*devicePixelRatio; fc.style.width=innerWidth+'px'; fc.style.height=innerHeight+'px';
  flecks=Array.from({length:Math.round(innerWidth*innerHeight/9000)},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:1+Math.random()*3.2,r:Math.random()*Math.PI,v:.05+Math.random()*.15,c:Math.random()<.2?'#dff4ef':'#9fdcd5'})); }
function drawFlecks(){ fx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); fx.clearRect(0,0,innerWidth,innerHeight);
  for(const f of flecks){ if(!reduce){ f.y-=f.v; f.r+=.004; if(f.y<-6){f.y=innerHeight+6;f.x=Math.random()*innerWidth;} }
    fx.save(); fx.translate(f.x,f.y); fx.rotate(f.r); fx.fillStyle=f.c; fx.beginPath(); fx.moveTo(-f.s,-f.s*.6); fx.lineTo(f.s,-f.s*.2); fx.lineTo(f.s*.4,f.s*.8); fx.closePath(); fx.fill(); fx.restore(); } }
sizeFlecks();

/* ---------- scene ---------- */
const mount=document.getElementById('mount');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
mount.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,200);
camera.position.set(0,0,40);
const hemi=new THREE.HemisphereLight(0xfff6df,0x3d6e6a,1.15); scene.add(hemi);
const sunLight=new THREE.DirectionalLight(0xffffff,1.6); sunLight.position.set(8,10,12); scene.add(sunLight);
const ramp=new THREE.DataTexture(new Uint8Array([90,90,90,255, 175,175,175,255, 255,255,255,255]),3,1,THREE.RGBAFormat);
ramp.minFilter=ramp.magFilter=THREE.NearestFilter; ramp.needsUpdate=true;
const toon=(color,extra={})=>new THREE.MeshToonMaterial({color,gradientMap:ramp,...extra});
const INK=0x1f2d2e;
function outline(mesh,scale=1.06){ const o=new THREE.Mesh(mesh.geometry,new THREE.MeshBasicMaterial({color:INK,side:THREE.BackSide})); o.scale.setScalar(scale); mesh.add(o); return o; }

const R=6;
const planet=new THREE.Group(); scene.add(planet);

/* ---------- real geography: Texas mapped onto the planet ----------
   Texas is scaled up (K) so it fills the face of the planet; everything placed on it
   uses real latitude/longitude. */
const K=5.6, LAT0=31.0, LON0=-99.8;
const toP=(lat,lon)=>[(lat-LAT0)*K,(lon-LON0)*K];
const fromP=(plat,plon)=>[LAT0+plat/K, LON0+plon/K];
// Simplified Texas outline (lat, lon), clockwise from the Panhandle's NW corner
const TX=[[36.5,-103.04],[36.5,-100.0],[34.56,-100.0],[34.4,-99.4],[34.2,-98.6],[33.85,-97.6],[33.7,-96.6],[33.85,-95.8],[33.6,-94.9],[33.55,-94.04],[31.9,-94.04],[31.0,-93.6],[30.2,-93.72],[29.7,-93.84],[29.55,-94.5],[29.3,-94.8],[28.95,-95.3],[28.6,-95.9],[28.3,-96.6],[27.8,-97.2],[27.2,-97.35],[26.6,-97.3],[26.1,-97.2],[25.95,-97.15],[26.05,-97.6],[26.2,-98.2],[26.4,-98.9],[27.2,-99.45],[27.8,-99.6],[28.7,-100.5],[29.3,-100.9],[29.8,-101.4],[29.77,-102.4],[29.4,-102.8],[29.0,-103.1],[29.1,-103.5],[29.5,-104.3],[30.2,-104.7],[30.6,-104.97],[31.1,-105.6],[31.3,-106.2],[31.8,-106.53],[32.0,-106.62],[32.0,-103.06]];
function inPoly(lat,lon,poly){ let c=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const [yi,xi]=poly[i],[yj,xj]=poly[j];
  if(((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi)) c=!c; } return c; }
function edgeDist(lat,lon){ let m=1e9; for(let i=0,j=TX.length-1;i<TX.length;j=i++){ const [ay,ax]=TX[j],[by,bx]=TX[i];
  const dx=bx-ax,dy=by-ay,t=clamp(((lon-ax)*dx+(lat-ay)*dy)/(dx*dx+dy*dy),0,1); const ex=ax+t*dx-lon, ey=ay+t*dy-lat; m=Math.min(m,Math.hypot(ex,ey)); } return m; }
// neighbours: rough land around Texas (Oklahoma/NM/Louisiana/Mexico), Gulf stays sea
function neighbour(lat,lon){
  if(lat>36.8||lat<22) return false;
  if(lon>-97.4 && lat<29.9 && !(lon>-93.9 && lat>29.6)) return false; // Gulf of Mexico
  if(lon>-98.2 && lat<25.9) return false;
  return lon>-110 && lon<-89;
}
function hash(x,y,z){ const s=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453; return s-Math.floor(s); }
function noise(v){ const p=v.clone().multiplyScalar(1.6); const i=new THREE.Vector3(Math.floor(p.x),Math.floor(p.y),Math.floor(p.z)); const f=p.clone().sub(i);
  let n=0; for(let dx=0;dx<2;dx++)for(let dy=0;dy<2;dy++)for(let dz=0;dz<2;dz++){ const w=(dx?f.x:1-f.x)*(dy?f.y:1-f.y)*(dz?f.z:1-f.z); n+=w*hash(i.x+dx,i.y+dy,i.z+dz);} return n; }
function sphereToLL(v){ const lat=90-Math.acos(clamp(v.y,-1,1))*180/Math.PI; let th=Math.atan2(v.z,-v.x)*180/Math.PI; if(th<0) th+=360; return [lat, th-180]; }
{
  const geo=new THREE.IcosahedronGeometry(R,48);
  const pos=geo.attributes.position, col=[], v=new THREE.Vector3(), c=new THREE.Color();
  for(let k=0;k<pos.count;k++){
    v.fromBufferAttribute(pos,k).normalize();
    const [plat,plon]=sphereToLL(v); const [lat,lon]=fromP(plat,plon);
    const n=noise(v.clone().multiplyScalar(2.2));
    let h=-.08;
    if(inPoly(lat,lon,TX)){
      const e=edgeDist(lat,lon);
      h = e<.18 ? .05 : .12+n*.06;
      // west is desert, east is green; the coast is sand
      const west=clamp((-lon-96.5)/7,0,1);
      if(e<.18 && lat<30.2 && lon>-97.8) c.set(0xeadfb8);
      else c.lerpColors(new THREE.Color(0x4f9a5c),new THREE.Color(0xe0a95a),west).offsetHSL(0,.05,(n-.5)*.08);
    } else if(neighbour(lat,lon)){
      h=.02; c.set(0xc9cfbf).offsetHSL(0,0,(n-.5)*.04);
    } else if(Math.abs(plat)>75 || Math.abs(plon)>95){
      // far side of the planet: little islands
      const m=noise(v)*.65+noise(v.clone().multiplyScalar(2.3))*.35;
      if(m>.5){ h=(m-.5)*.8; c.set(m<.54?0xeadfb8:0x7fae83); } else c.set(0x59b3c9);
    } else c.set(0x59b3c9);
    const r=R+h; pos.setXYZ(k,v.x*r,v.y*r,v.z*r); col.push(c.r,c.g,c.b);
  }
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3)); geo.computeVertexNormals();
  const ground=new THREE.Mesh(geo,toon(0xffffff,{vertexColors:true}));
  planet.add(ground); outline(ground,1.012);
}
// Texas border line
{ const pts=TX.concat([TX[0]]).map(([la,lo])=>{ const [a,b]=toP(la,lo); return llVec(a,b,R+.13); });
  const tube=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,true,'catmullrom',.1),400,.035,5,true),new THREE.MeshBasicMaterial({color:INK})); planet.add(tube); }
function llVec(plat,plon,r){ const phi=(90-plat)*Math.PI/180, th=(plon+180)*Math.PI/180;
  return new THREE.Vector3(-Math.sin(phi)*Math.cos(th),Math.cos(phi),Math.sin(phi)*Math.sin(th)).multiplyScalar(r); }
// place an object at a real lat/lon, "up" = surface normal
function place(obj,lat,lon,lift=0){
  const [a,b]=toP(lat,lon); const n=llVec(a,b,1);
  obj.position.copy(n.clone().multiplyScalar(R+.12+lift));
  obj.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),n);
  planet.add(obj); return obj;
}
function box(w,h,d,color){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),toon(color)); m.position.y=h/2; outline(m,1.08); return m; }
function cyl(rt,rb,h,color,seg=10){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),toon(color)); m.position.y=h/2; outline(m,1.08); return m; }
const SITES = {};

/* ---------- real plants (EIA-860, ERCOT balancing authority, 10 MW+) ---------- */
const FUEL={
  wind:{c:0xf3efdf,label:'Wind',css:'#f3efdf'}, solar:{c:0x3d5f8f,label:'Solar',css:'#3d5f8f'}, gas:{c:0xe8914a,label:'Gas',css:'#e8914a'},
  storage:{c:0x58c47a,label:'Battery',css:'#58c47a'}, coal:{c:0x4a4a4a,label:'Coal',css:'#4a4a4a'}, nuclear:{c:0xe2b53c,label:'Nuclear',css:'#e2b53c'},
  hydro:{c:0x59b3c9,label:'Hydro',css:'#59b3c9'}, other:{c:0xa99bc9,label:'Other',css:'#a99bc9'}
};
const fuelOf=p=>FUEL[p.prim]?p.prim:'other';
const GEOM={
  wind:new THREE.CylinderGeometry(.018,.03,1,5).translate(0,.5,0),
  solar:new THREE.BoxGeometry(1,.12,.7).translate(0,.06,0),
  gas:new THREE.CylinderGeometry(.32,.4,1,8).translate(0,.5,0),
  storage:new THREE.BoxGeometry(.8,.5,.5).translate(0,.25,0),
  coal:new THREE.BoxGeometry(.7,1,.7).translate(0,.5,0),
  nuclear:new THREE.SphereGeometry(.5,12,8,0,Math.PI*2,0,Math.PI/2),
  hydro:new THREE.CylinderGeometry(.4,.4,.35,10).translate(0,.17,0),
  other:new THREE.OctahedronGeometry(.4).translate(0,.4,0)
};
const plantMeshes={}, panelMats=[];
let plantGroup=new THREE.Group(); planet.add(plantGroup);
const heroRotors=[];
function buildPlants(){
  const by={}; PLANTS.forEach(p=>{ (by[fuelOf(p)] ||= []).push(p); });
  const m4=new THREE.Matrix4(), q=new THREE.Quaternion(), s=new THREE.Vector3(), up=new THREE.Vector3(0,1,0);
  for(const [f,list] of Object.entries(by)){
    const mat=toon(FUEL[f].c); if(f==='solar') panelMats.push(mat);
    const im=new THREE.InstancedMesh(GEOM[f],mat,list.length);
    list.forEach((p,i)=>{ const [a,b]=toP(p.lat,p.lon); const n=llVec(a,b,1);
      const sz=clamp(Math.sqrt(p.mw)/22,.15,1.2);
      q.setFromUnitVectors(up,n);
      if(f==='wind') s.set(1.6,.14+sz*.38,1.6); else if(f==='solar') s.set(sz*.3,1,sz*.3); else s.set(sz*.22,sz*.26,sz*.22);
      m4.compose(n.clone().multiplyScalar(R+.12),q,s); im.setMatrixAt(i,m4); });
    im.userData={fuel:f,list}; plantGroup.add(im); plantMeshes[f]=im;
    // ink outline copy
    const ol=new THREE.InstancedMesh(GEOM[f],new THREE.MeshBasicMaterial({color:INK,side:THREE.BackSide}),list.length);

function applySnap(){
  const s=SNAP; if(!s) return;
  state.wind = s.wind?.actualMW!=null ? clamp(s.wind.actualMW/FLEET.wind,0,1) : state.wind;
  const solarNow = s.solar ? (s.solar.series?.[Math.max(0,(s.heNow||1)-1)] ?? s.solar.actualMW) : 0;
  state.solar = clamp((solarNow||0)/FLEET.solar,0,1);
  state.demand = s.demand&&s.sced ? clamp(s.demand.mw/s.sced.onlineHSL,0,1) : state.demand;
  HUBS.forEach(([id])=>{ const p=hubPrice(id); if(p==null) return; const t=towers[id]; t.h=.25+clamp(p/200,0,1)*2.4;
    t.shaft.material.color=new THREE.Color().lerpColors(new THREE.Color(0x6fbf7a),new THREE.Color(0xe0453a),clamp(p/200,0,1)); });
  const top=[...(s.checks||[])].sort((a,b)=>b.p-a.p)[0]; state.beam = top ? new THREE.Color(band(top.p)).getHex() : 0x9aa5a3;
  ['log','review','alert'].forEach(k=>state.flags[k]=(s.checks||[]).filter(c=>c.route===k).length);
  (s.weather?.zones||[]).forEach(z=>{ const c=clouds[z.zone]; if(!c) return; const col=new THREE.Color().lerpColors(new THREE.Color(0xd9f1ff),new THREE.Color(0xffc9a8),clamp((z.tempF-60)/35,0,1)); c.children.forEach(m=>m.material.color=col); });
  panelMats.forEach(m=>m.emissive=new THREE.Color(0x8fd0ea).multiplyScalar(state.solar*.9));
  windows.forEach((w,i)=>w.material.color=new THREE.Color(((i*7)%windows.length)/windows.length < state.demand ? 0xffe08a : 0x5b6b6a));
  lamp.material.color.setHex(state.beam); beam.material.color.setHex(state.beam);
  document.getElementById('sced').textContent = s.sced ? s.sced.timestamp.slice(11,16) + ' CT' : '--:--';
  document.getElementById('lambda').textContent = s.sced ? `λ ${money(s.sced.systemLambda)} · ${fmt(s.demand?.mw)} MW` : 'λ —';
}

const intro=document.getElementById('intro');
planet.scale.setScalar(.55);
// start with Texas facing the camera
planet.quaternion.setFromUnitVectors(llVec(0,0,1),new THREE.Vector3(0,.15,1).normalize());
function begin(){
  document.getElementById('app').classList.add('ready');
  const tl = window.gsap ? gsap.timeline() : null;
  if(tl && !reduce){
    tl.to('#intro',{opacity:0,duration:.45,ease:'power2.in',onComplete:()=>intro.remove()})
      .to(planet.scale,{x:1,y:1,z:1,duration:1.2,ease:'back.out(1.4)'},'<.1')
      .to('.hud',{opacity:1,duration:.5,stagger:.06},'-=.5')
      .from('.chip',{y:20,opacity:0,stagger:.04,duration:.35,ease:'back.out(2)'},'-=.3');
  } else { intro.remove(); planet.scale.setScalar(1); document.querySelectorAll('.hud').forEach(h=>h.style.opacity=1); }
  renderAll(); faceSite('price'); selected='price';
}
document.getElementById('begin').onclick=begin;
if(qs.has('skip')||qs.has('embed')) begin();

/* ---------- loop ---------- */
const clock=new THREE.Clock(); const up=new THREE.Vector3(); const tmp=new THREE.Vector3();
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  drawFlecks();
  if(targetQ){ planet.quaternion.slerp(targetQ,.06); if(planet.quaternion.angleTo(targetQ)<.002) targetQ=null; }
  else if(spinning && !dragging) rotateBy(.0018,0);
  else if(!dragging){ velX*=.92; velY*=.92; if(Math.abs(velX)+Math.abs(velY)>.0002) rotateBy(velX,velY); }
  heroRotors.forEach((r,i)=>r.rotation.z -= (0.3+state.wind*10)*dt*(1+i*.05));
  Object.values(towers).forEach(tw=>{ tw.shaft.scale.y += (tw.h-tw.shaft.scale.y)*.05; tw.top.position.y=.14+tw.shaft.scale.y+.2; tw.top.rotation.y+=dt; });
  Object.values(rings).forEach((r,i)=>{ const on=r.score>=70; const s=on?1+Math.sin(t*3+i)*.08:1; r.ring.scale.setScalar(s); r.disk.material.opacity=on?.22+Math.sin(t*3+i)*.08:.1; });
  SITES.jev.pivot.rotation.y += dt*.9; beam.material.opacity=.18+Math.sin(t*2)*.06;
  ['log','review','alert'].forEach((k,i)=>{ const f=flags[k]; const y=.15+Math.min(state.flags[k],4)*.22; f.position.y += (y-f.position.y)*.06; f.rotation.y=Math.sin(t*3+i)*.25; });
  Object.values(clouds).forEach((c,i)=>{ c.position.x=Math.sin(t*.3+i)*.25; c.position.y=1.5+Math.sin(t*.7+i)*.08; });
  // real sky: the sun sits where it would be over Texas at this Central Time hour
  const hr = SNAP ? SNAP.ct.hour + SNAP.ct.minute/60 : 12;
  if(realSky){
    const txN=llVec(0,0,1).applyQuaternion(planet.quaternion);
    const eastN=llVec(0,20,1).applyQuaternion(planet.quaternion).sub(txN).normalize();
    const a=(hr-12)/12*Math.PI; // noon overhead, midnight behind
    const sunDir=txN.clone().multiplyScalar(Math.cos(a)).add(eastN.clone().multiplyScalar(-Math.sin(a)));
    sunLight.position.copy(sunDir.multiplyScalar(20).add(new THREE.Vector3(0,6,0)));
    const day=clamp(Math.cos(a)+.25,0,1); sunLight.intensity=.35+day*1.3; hemi.intensity=.75+day*.45;
  } else { sunLight.position.set(8,10,14); sunLight.intensity=1.6; hemi.intensity=1.15; }
  for(const it of INFO){
    const s=SITES[it.id]; const el=tagEls[it.id]; if(!s){ el.style.opacity=0; continue; }
    s.group.getWorldPosition(tmp); up.copy(tmp).normalize();
    const facing = up.dot(camera.position.clone().normalize());
    const lift={weather:2.6,jev:2.4,help:.6}[it.id] ?? 1.6;
    const p = tmp.clone().add(up.multiplyScalar(lift)).project(camera);
    el.style.left=`${(p.x+1)/2*innerWidth}px`; el.style.top=`${(-p.y+1)/2*innerHeight}px`;
    const vis = facing>.2 && it.id===selected && !plantSel;
    el.style.opacity = vis ? 1 : 0; el.style.pointerEvents = vis ? 'auto' : 'none';
  }
  renderer.render(scene,camera);
}
tick();
function fit(){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); sizeFlecks(); camera.position.z = EMBED ? 33 : innerWidth<720 ? 40 : innerWidth<1000 ? 33 : 29; }
addEventListener('resize',fit); fit();
</script>
</body>
</html>
