<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>God's Eye ERCOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Cesium.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/* Visual language follows God's Eye View (MIT, bilawalsidhu/gods-eye-view): dark glass, cyan accent, mono HUD. */
:root{
  --bg-dark:#0a0a0f; --glass-bg:rgba(12,12,20,.72); --glass-border:rgba(255,255,255,.08); --glass-border-hover:rgba(255,255,255,.15);
  --accent:#00d4ff; --accent-dim:rgba(0,212,255,.15); --accent-glow:rgba(0,212,255,.4);
  --text-primary:#e8eaed; --text-secondary:rgba(232,234,237,.5); --text-dim:rgba(232,234,237,.3);
  --good:#3ddc84; --warn:#ffb020; --bad:#ff4d5e;
  --font-mono:'JetBrains Mono','SF Mono','Fira Code',monospace; --font-sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --panel-radius:16px; --btn-radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-dark);color:var(--text-primary);font-family:var(--font-sans)}
#globe{position:absolute;inset:0}
#globe .cesium-viewer-bottom{left:auto;right:12px;bottom:6px}
.cesium-credit-textContainer,.cesium-credit-logoContainer{opacity:.6}
#fx{position:absolute;inset:0;pointer-events:none;z-index:2;mix-blend-mode:normal}
body.look-crt #fx{background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);}
body.look-flir #globe canvas{filter:grayscale(1) contrast(1.35) brightness(1.1) sepia(.2) hue-rotate(-20deg)}
body.look-nvg #globe canvas{filter:grayscale(1) sepia(1) hue-rotate(60deg) saturate(3) brightness(1.05) contrast(1.2)}
body.look-nvg #fx{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(5,6,10,.7) 100%)}
.glass{background:var(--glass-bg);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);border:1px solid var(--glass-border);border-radius:var(--panel-radius)}
.hud{position:absolute;z-index:5}
.mono{font-family:var(--font-mono)}
.eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-secondary)}

.brand{top:20px;left:24px;display:flex;gap:14px;align-items:center}
.logo{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--accent);box-shadow:0 0 18px var(--accent-glow),inset 0 0 12px var(--accent-dim);position:relative}
.logo::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.brand h1{font-family:var(--font-mono);font-size:15px;letter-spacing:.24em;font-weight:700}
.brand h1 span{color:var(--accent)}
.brand .eyebrow{margin-top:4px}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--good)}
.live i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;animation:pulse 1.6s infinite}
.live.down{color:var(--bad)}
@keyframes pulse{50%{opacity:.3}}

.readout{top:20px;left:50%;transform:translateX(-50%);padding:8px 16px;display:flex;gap:22px;font-family:var(--font-mono);font-size:11px;white-space:nowrap}
.readout b{color:var(--accent);font-weight:500;margin-left:6px}

.layers{top:96px;left:24px;width:212px;padding:12px}
.layers .eyebrow{padding:2px 4px 8px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:8px 10px;border-radius:var(--btn-radius);border:1px solid transparent;background:transparent;color:var(--text-primary);font:500 12px var(--font-sans);cursor:pointer;transition:all .15s}
.toggle:hover{border-color:var(--glass-border-hover);background:rgba(255,255,255,.03)}
.toggle .sw{width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px currentColor;flex:none}
.toggle .lbl{display:flex;gap:9px;align-items:center}
.toggle .st{font:500 10px var(--font-mono);color:var(--text-dim);letter-spacing:.1em}
.toggle.on .st{color:var(--accent)}
.toggle.off{opacity:.5}
.looks{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid var(--glass-border)}
.looks button{font:500 10px var(--font-mono);letter-spacing:.08em;padding:6px 0;border-radius:8px;border:1px solid var(--glass-border);background:transparent;color:var(--text-secondary);cursor:pointer}
.looks button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}

.intel{top:96px;right:24px;width:330px;max-height:calc(100% - 200px);overflow:auto;padding:14px}
.intel h2{font-family:var(--font-mono);font-size:13px;letter-spacing:.14em;margin:6px 0 10px;color:var(--accent);text-transform:uppercase}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--glass-border);font-size:12px}
.row:last-child{border-bottom:0}
.row .k{color:var(--text-secondary)}
.row .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.sect{margin-top:14px}
.check{padding:9px 10px;border:1px solid var(--glass-border);border-radius:10px;margin-top:8px}
.check .q{font-size:12px;line-height:1.4}
.check .m{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font:500 10px var(--font-mono);letter-spacing:.08em;color:var(--text-secondary);text-transform:uppercase}
.check .p{font:700 16px var(--font-mono)}
.bar{height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%}
.note{font-size:11px;color:var(--text-dim);margin-top:10px;line-height:1.45}

.dash{display:inline-block;margin-top:6px;font:500 10px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);text-decoration:none}
.dash:hover{text-decoration:underline}
[hidden]{display:none!important}
.market{left:24px;bottom:84px;width:300px;max-height:34vh;overflow:auto;padding:12px}
.mf-title{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-secondary);margin:2px 0 6px}
.mf-strip,.mf-alerts{list-style:none;margin:0 0 10px;padding:0;font-size:12px}
.mf-strip li,.mf-alerts li{padding:5px 0;border-bottom:1px solid var(--glass-border)}
.mf-strip li:last-child,.mf-alerts li:last-child{border-bottom:0}
.mf-strip b{color:var(--accent);font-weight:500}
.mf-alerts b{float:right;font-family:var(--font-mono);color:var(--bad)}

.dock{left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;max-width:calc(100vw - 32px);overflow-x:auto}
.dock button{flex:none;font:500 11px var(--font-mono);letter-spacing:.08em;padding:9px 12px;border-radius:var(--btn-radius);border:1px solid var(--glass-border);background:transparent;color:var(--text-primary);cursor:pointer;transition:all .15s;white-space:nowrap}
.dock button:hover{border-color:var(--accent);color:var(--accent)}
.dock button b{color:var(--accent);font-weight:500;margin-left:6px}

.target{position:absolute;z-index:4;pointer-events:none;transform:translate(-50%,-50%)}
.target .box{width:46px;height:46px;border:1px solid var(--accent);box-shadow:0 0 10px var(--accent-glow)}
.target .box::before,.target .box::after{content:"";position:absolute;width:10px;height:10px;border-color:var(--accent);border-style:solid}
.target .tag{position:absolute;left:54px;top:-2px;font:500 10px var(--font-mono);letter-spacing:.1em;color:var(--accent);white-space:nowrap;background:rgba(10,10,15,.7);padding:2px 5px;border-left:2px solid var(--accent)}
.target .tag b{color:var(--text-primary);font-weight:500}

button:focus-visible{outline:2px solid var(--text-primary);outline-offset:2px}
@media (max-width:820px){
  .readout{display:none}
  .layers{top:auto;bottom:84px;left:12px;width:auto;right:12px;display:flex;overflow-x:auto;gap:4px;padding:8px}
  .layers .eyebrow,.looks{display:none}
  .toggle{flex:none;width:auto}
  .intel{top:78px;right:12px;left:12px;width:auto;max-height:34vh}
  .brand{left:12px;top:12px}
  .brand h1{font-size:12px}
  .market{left:12px;right:12px;bottom:140px;width:auto;max-height:22vh}
}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
</style>
</head>
<body>
<div id="globe"></div>
<div class="vignette"></div>
<div id="fx"></div>
<div id="targets"></div>

<div class="hud brand">
  <div class="logo"></div>
  <div><h1>GOD'S EYE <span>// ERCOT</span></h1><div class="eyebrow"><span class="live" id="live"><i></i><span id="liveText">acquiring feed</span></span></div><a class="dash" id="dashboard" href="#" hidden>GridMarket dashboard →</a></div>
</div>
<div class="hud readout glass" id="readout">
  <span>LAT<b id="lat">—</b></span><span>LON<b id="lon">—</b></span><span>ALT<b id="alt">—</b></span><span>SCED<b id="sced">—</b></span><span>λ<b id="lam">—</b></span>
</div>

<div class="hud layers glass" id="layers">
  <div class="eyebrow">// layers</div>
  <div class="looks" id="looks">
    <button data-look="none" class="on">STD</button><button data-look="flir">FLIR</button><button data-look="nvg">NVG</button><button data-look="crt">CRT</button>
  </div>
</div>

<div class="hud intel glass" id="intel"><div class="eyebrow">// intel feed</div><h2>Acquiring ERCOT</h2></div>
<div class="hud dock glass" id="dock"></div>
<div class="hud market glass" id="market" hidden aria-label="Market activity and router checks (baseline rules)"></div>

<script>
const fmt=(n,d=0)=>n==null||!isFinite(n)?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=n=>n==null?'—':(n<0?'−$':'$')+fmt(Math.abs(n),2);
const signed=(n,d=0)=>n==null?'—':(n>0?'+':n<0?'−':'')+fmt(Math.abs(n),d);
const band=p=>p>=.8?'#3ddc84':p>=.5?'#ffb020':'#8a8f98';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const C=Cesium;

/* Places. Hubs sit on the metro that anchors each trading hub; weather zones use ERCOT's zone centers (approximate). */
const HUBS={HB_NORTH:[-96.80,32.78,'Dallas–Fort Worth'],HB_HOUSTON:[-95.37,29.76,'Houston'],HB_SOUTH:[-98.49,29.42,'San Antonio'],HB_WEST:[-102.08,31.99,'Midland–Odessa']};
const ZONES={'Coast':[-95.2,29.3],'East':[-94.6,31.8],'Far West':[-103.4,31.0],'North':[-98.6,33.7],'North Central':[-97.3,32.4],'South Central':[-97.7,30.2],'Southern':[-98.2,27.4],'West':[-100.4,32.2]};
const WIND=[[-101.9,35.2,'Panhandle wind'],[-100.8,32.4,'West Texas wind'],[-97.6,27.0,'Coastal wind']];
const SOLAR=[[-102.9,31.3,'Permian solar'],[-99.9,31.1,'Central West solar']];
const LOAD=[[-96.8,32.78],[-95.37,29.76],[-98.49,29.42],[-97.74,30.27]];
const BASE_HQ=[-97.745,30.258];
const TX=[[-106.6,31.9],[-106.5,32.0],[-103.06,32.0],[-103.04,36.5],[-103.0,36.5],[-100.0,36.5],[-100.0,34.56],[-99.2,34.37],[-98.1,34.13],[-97.0,33.85],[-96.3,33.75],[-95.3,33.87],[-94.48,33.64],[-94.04,33.55],[-94.04,31.99],[-93.6,31.0],[-93.7,30.07],[-93.84,29.7],[-94.7,29.35],[-95.3,28.9],[-96.4,28.4],[-97.2,27.8],[-97.4,26.9],[-97.15,25.95],[-97.5,25.9],[-98.2,26.06],[-99.1,26.45],[-99.5,27.5],[-100.3,28.3],[-101.0,29.7],[-101.8,29.8],[-102.4,29.8],[-102.7,29.7],[-103.1,29.0],[-103.8,29.3],[-104.5,29.7],[-104.9,30.6],[-105.6,31.1],[-106.2,31.5],[-106.6,31.9]];

/* Viewer: keyless Esri World Imagery, the same default God's Eye View uses without credentials. */
C.Ion.defaultAccessToken='';
const viewer=new C.Viewer('globe',{
  baseLayer:C.ImageryLayer.fromProviderAsync(C.ArcGisMapServerImageryProvider.fromUrl('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer',{credit:'Powered by Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community',enablePickFeatures:false})),
  terrain:undefined, geocoder:false, homeButton:false, sceneModePicker:false, baseLayerPicker:false, navigationHelpButton:false,
  animation:false, timeline:false, fullscreenButton:false, infoBox:false, selectionIndicator:false, requestRenderMode:false
});
const scene=viewer.scene;
scene.globe.enableLighting=false;
scene.skyAtmosphere.show=true;
scene.globe.showGroundAtmosphere=true;
scene.fog.enabled=true;
scene.globe.baseColor=C.Color.fromCssColorString('#0a0a0f');
viewer.imageryLayers.layerAdded.addEventListener(l=>{l.brightness=.72;l.saturation=.7;l.contrast=1.08;});
if(viewer.imageryLayers.length) { const l=viewer.imageryLayers.get(0); l.brightness=.72; l.saturation=.7; l.contrast=1.08; }
scene.postProcessStages.bloom && (scene.postProcessStages.bloom.enabled=false);

const ACC=C.Color.fromCssColorString('#00d4ff');
const G={};
['outline','prices','weather','renew','load','flows','decision'].forEach(k=>{ G[k]=new C.CustomDataSource(k); viewer.dataSources.add(G[k]); });

/* Texas outline and a faint cyan scan wall */
G.outline.entities.add({polyline:{positions:C.Cartesian3.fromDegreesArray(TX.flat()),width:2,material:new C.PolylineGlowMaterialProperty({glowPower:.25,color:ACC.withAlpha(.9)}),clampToGround:true}});
G.outline.entities.add({wall:{positions:C.Cartesian3.fromDegreesArrayHeights(TX.flatMap(p=>[p[0],p[1],60000])),minimumHeights:TX.map(()=>0),material:new C.ColorMaterialProperty(ACC.withAlpha(.05)),outline:false}});

/* Base Power HQ: where the hackathon runs */
G.decision.entities.add({position:C.Cartesian3.fromDegrees(...BASE_HQ),point:{pixelSize:7,color:C.Color.WHITE,outlineColor:ACC,outlineWidth:2},
  label:{text:'BASE POWER HQ · 205 E RIVERSIDE',font:'500 11px JetBrains Mono',fillColor:C.Color.WHITE.withAlpha(.85),showBackground:true,backgroundColor:C.Color.fromCssColorString('#0a0a0f').withAlpha(.7),pixelOffset:new C.Cartesian2(0,-18),distanceDisplayCondition:new C.DistanceDisplayCondition(0,900000)}});

/* ---------- live state ---------- */
let SNAP=null;
const state={hub:{},temps:{},wind:0,solar:0,demand:.7,checks:[]};
const priceColor=p=>{ if(p==null) return C.Color.GRAY; const t=clamp(p/150,0,1); return C.Color.lerp(C.Color.fromCssColorString('#3ddc84'),C.Color.fromCssColorString('#ff4d5e'),t,new C.Color()); };
const tempColor=t=>C.Color.lerp(C.Color.fromCssColorString('#4fa3ff'),C.Color.fromCssColorString('#ff8a3d'),clamp((t-60)/35,0,1),new C.Color());

// Hub price columns: height and color follow the live 15-minute SPP (full height at $200/MWh)
const colLen=hub=>20000+clamp((state.hub[hub]??0)/200,0,1)*380000;
Object.entries(HUBS).forEach(([hub,[lon,lat]])=>{
  G.prices.entities.add({id:'hub-'+hub,
    position:new C.CallbackProperty(()=>C.Cartesian3.fromDegrees(lon,lat,colLen(hub)/2),false),
    cylinder:{length:new C.CallbackProperty(()=>colLen(hub),false),topRadius:9000,bottomRadius:9000,
      material:new C.ColorMaterialProperty(new C.CallbackProperty(()=>priceColor(state.hub[hub]).withAlpha(.8),false)),outline:true,outlineColor:ACC.withAlpha(.5)}});
  G.prices.entities.add({id:'hubtag-'+hub,
    position:new C.CallbackProperty(()=>C.Cartesian3.fromDegrees(lon,lat,colLen(hub)+8000),false),
    label:{text:new C.CallbackProperty(()=>`${hub.replace('HB_','')}  ${money(state.hub[hub])}`,false),font:'500 12px JetBrains Mono',fillColor:C.Color.WHITE,showBackground:true,
      backgroundColor:C.Color.fromCssColorString('#0a0a0f').withAlpha(.78),backgroundPadding:new C.Cartesian2(6,4),verticalOrigin:C.VerticalOrigin.BOTTOM,pixelOffset:new C.Cartesian2(0,-6),
      disableDepthTestDistance:Number.POSITIVE_INFINITY}});
});

// Weather zones: tinted discs + temperature tags
Object.entries(ZONES).forEach(([zone,[lon,lat]])=>{
  G.weather.entities.add({position:C.Cartesian3.fromDegrees(lon,lat),
    ellipse:{semiMajorAxis:95000,semiMinorAxis:95000,material:new C.ColorMaterialProperty(new C.CallbackProperty(()=>state.temps[zone]!=null?tempColor(state.temps[zone]).withAlpha(.22):C.Color.WHITE.withAlpha(.05),false)),
      outline:true,outlineColor:new C.CallbackProperty(()=>state.temps[zone]!=null?tempColor(state.temps[zone]).withAlpha(.7):C.Color.WHITE.withAlpha(.2),false),height:0},
    label:{text:new C.CallbackProperty(()=>`${zone.toUpperCase()}  ${state.temps[zone]!=null?fmt(state.temps[zone],1)+'°F':'—'}`,false),font:'500 10px JetBrains Mono',
      fillColor:C.Color.WHITE.withAlpha(.85),showBackground:true,backgroundColor:C.Color.fromCssColorString('#0a0a0f').withAlpha(.55),pixelOffset:new C.Cartesian2(0,22),
      distanceDisplayCondition:new C.DistanceDisplayCondition(0,4200000)}});
});

// Renewables: pulsing rings sized by output
let pulse=0;
WIND.forEach(([lon,lat,name])=>G.renew.entities.add({position:C.Cartesian3.fromDegrees(lon,lat),
  ellipse:{semiMajorAxis:new C.CallbackProperty(()=>40000+state.wind*90000+(pulse%1)*30000,false),semiMinorAxis:new C.CallbackProperty(()=>40000+state.wind*90000+(pulse%1)*30000,false),
    material:new C.ColorMaterialProperty(new C.CallbackProperty(()=>C.Color.fromCssColorString('#e8eaed').withAlpha(.18*(1-(pulse%1))),false)),outline:true,outlineColor:C.Color.fromCssColorString('#e8eaed').withAlpha(.6),height:1000},
  label:{text:new C.CallbackProperty(()=>`◎ ${name.toUpperCase()}`,false),font:'500 10px JetBrains Mono',fillColor:C.Color.WHITE.withAlpha(.8),pixelOffset:new C.Cartesian2(0,-14),distanceDisplayCondition:new C.DistanceDisplayCondition(0,3500000)}}));
SOLAR.forEach(([lon,lat,name])=>G.renew.entities.add({position:C.Cartesian3.fromDegrees(lon,lat),
  ellipse:{semiMajorAxis:new C.CallbackProperty(()=>30000+state.solar*110000,false),semiMinorAxis:new C.CallbackProperty(()=>30000+state.solar*110000,false),
    material:new C.ColorMaterialProperty(new C.CallbackProperty(()=>C.Color.fromCssColorString('#ffd24a').withAlpha(.08+state.solar*.3),false)),outline:true,outlineColor:C.Color.fromCssColorString('#ffd24a').withAlpha(.7),height:1000},
  label:{text:`☀ ${name.toUpperCase()}`,font:'500 10px JetBrains Mono',fillColor:C.Color.fromCssColorString('#ffd24a'),pixelOffset:new C.Cartesian2(0,-14),distanceDisplayCondition:new C.DistanceDisplayCondition(0,3500000)}}));

// Load centers: glow dots scaled by demand vs capacity
LOAD.forEach(([lon,lat])=>G.load.entities.add({position:C.Cartesian3.fromDegrees(lon,lat),
  point:{pixelSize:new C.CallbackProperty(()=>8+state.demand*14+Math.sin(pulse*6.28)*2,false),color:C.Color.fromCssColorString('#ff8a3d').withAlpha(.85),outlineColor:C.Color.WHITE.withAlpha(.6),outlineWidth:1}}));

// Flows: arcs from generation regions to load centers
function arc(a,b,h=160000,n=40){ const pts=[]; for(let i=0;i<=n;i++){ const t=i/n; pts.push(C.Cartesian3.fromDegrees(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,Math.sin(Math.PI*t)*h)); } return pts; }
[[WIND[0],LOAD[0]],[WIND[1],LOAD[0]],[WIND[1],LOAD[3]],[SOLAR[0],LOAD[2]],[SOLAR[1],LOAD[3]],[WIND[2],LOAD[1]],[WIND[2],LOAD[2]]].forEach(([g,l],i)=>{
  G.flows.entities.add({polyline:{positions:arc(g,l,120000+i*15000),width:3,material:new C.PolylineDashMaterialProperty({color:ACC.withAlpha(.85),gapColor:C.Color.TRANSPARENT,dashLength:24})}});
});

/* ---------- HUD ---------- */
const LAYERS=[['prices','Hub prices','#ff4d5e'],['weather','Weather zones','#4fa3ff'],['renew','Wind + solar','#ffd24a'],['load','Load centers','#ff8a3d'],['flows','Power flows','#00d4ff'],['outline','Texas grid','#e8eaed']];
const layersEl=document.getElementById('layers');
LAYERS.forEach(([id,label,color])=>{ const b=document.createElement('button'); b.className='toggle on'; b.innerHTML=`<span class="lbl"><span class="sw" style="background:${color};color:${color}"></span>${label}</span><span class="st">ON</span>`;
  b.onclick=()=>{ G[id].show=!G[id].show; b.classList.toggle('on',G[id].show); b.classList.toggle('off',!G[id].show); b.querySelector('.st').textContent=G[id].show?'ON':'OFF'; };
  layersEl.insertBefore(b,document.getElementById('looks')); });
document.querySelectorAll('#looks button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#looks button').forEach(x=>x.classList.toggle('on',x===b)); document.body.className = b.dataset.look==='none'?'':'look-'+b.dataset.look; });

// Each target is a point on the ground; the camera orbits it at a range and pitch.
const FLY={
  texas:{lon:-99.3,lat:31.0,range:2300000,pitch:-52,label:'TEXAS'},
  north:{lon:-96.8,lat:32.78,range:520000,pitch:-40,label:'HB_NORTH'},
  houston:{lon:-95.37,lat:29.76,range:480000,pitch:-40,label:'HB_HOUSTON'},
  south:{lon:-98.49,lat:29.42,range:480000,pitch:-40,label:'HB_SOUTH'},
  west:{lon:-102.08,lat:31.99,range:560000,pitch:-40,label:'HB_WEST'},
  permian:{lon:-102.6,lat:31.4,range:700000,pitch:-38,label:'PERMIAN'},
  base:{lon:-97.745,lat:30.258,range:12000,pitch:-35,label:'BASE HQ'}
};
function fly(k,dur=2.4){ const f=FLY[k];
  viewer.camera.flyToBoundingSphere(new C.BoundingSphere(C.Cartesian3.fromDegrees(f.lon,f.lat,0),1),
    {offset:new C.HeadingPitchRange(0,C.Math.toRadians(f.pitch),f.range),duration:dur,easingFunction:C.EasingFunction.QUADRATIC_IN_OUT}); }
const dock=document.getElementById('dock');
function renderDock(){ dock.innerHTML=Object.entries(FLY).map(([k,f])=>{ const hub={north:'HB_NORTH',houston:'HB_HOUSTON',south:'HB_SOUTH',west:'HB_WEST'}[k]; return `<button data-k="${k}">${f.label}${hub&&state.hub[hub]!=null?`<b>${money(state.hub[hub])}</b>`:''}</button>`; }).join('');
  dock.querySelectorAll('button').forEach(b=>b.onclick=()=>fly(b.dataset.k)); }
renderDock();

const intel=document.getElementById('intel');
function renderIntel(){
  const s=SNAP; if(!s) return;
  const hn=s.hubs?.find(h=>h.hub==='HB_NORTH');
  intel.innerHTML=`<div class="eyebrow">// intel feed · ${s.ct.date} ${String(s.ct.hour).padStart(2,'0')}:${String(s.ct.minute).padStart(2,'0')} CT</div>
  <h2>ERCOT system</h2>
  <div class="row"><span class="k">Demand</span><span class="v">${fmt(s.demand?.mw)} MW</span></div>
  <div class="row"><span class="k">Today's peak</span><span class="v">${fmt(s.demand?.todayPeak)} MW</span></div>
  <div class="row"><span class="k">Online capacity (HSL)</span><span class="v">${fmt(s.sced?.onlineHSL)} MW</span></div>
  <div class="row"><span class="k">Headroom</span><span class="v">${fmt(s.sced?.headroomPct,1)}% · ${fmt(s.sced?.headroomMW)} MW</span></div>
  <div class="row"><span class="k">System lambda</span><span class="v">${money(s.sced?.systemLambda)}</span></div>
  <div class="sect eyebrow">// prices $/MWh</div>
  ${(s.hubs||[]).map(h=>`<div class="row"><span class="k">${h.hub}</span><span class="v" style="color:${priceColor(h.price).toCssColorString()}">${money(h.price)}</span></div>`).join('')}
  <div class="row"><span class="k">DA HB_NORTH · HE${s.dam?.hourEnding??'—'}</span><span class="v">${money(s.dam?.price)}</span></div>
  <div class="row"><span class="k">DART (RT − DA)</span><span class="v">${signed(s.dam?.dart,2)}</span></div>
  <div class="sect eyebrow">// supply</div>
  <div class="row"><span class="k">Wind · HE${s.wind?.actualHE??'—'}</span><span class="v">${fmt(s.wind?.actualMW)} MW <span style="color:var(--text-dim)">(${signed(s.wind?.errorMW)})</span></span></div>
  <div class="row"><span class="k">Solar · HE${s.solar?.actualHE??'—'}</span><span class="v">${fmt(s.solar?.actualMW)} MW <span style="color:var(--text-dim)">(${signed(s.solar?.errorMW)})</span></span></div>
  <div class="row"><span class="k">Weather zones avg</span><span class="v">${fmt(s.weather?.avgF,1)}°F</span></div>
  <div class="sect eyebrow">// decision checks</div>
  ${(s.checks||[]).map(c=>`<div class="check"><div class="q">${c.question}</div><div class="m"><span>${c.id} · ${c.route}</span><span class="p" style="color:${band(c.p)}">${fmt(c.p,2)}</span></div><div class="bar"><i style="width:${c.p*100}%;background:${band(c.p)}"></i></div></div>`).join('')}
  <div class="note">Baseline rules until jev-gateway is live. Not trading advice. Data: ERCOT Public API via ercot-hackathon worker. Hub columns sit on each hub's anchor metro; weather zone centers are approximate.</div>`;
}

async function load(){
  const live=document.getElementById('live'), lt=document.getElementById('liveText');
  try{ const r=await fetch('/api/snapshot'); if(!r.ok) throw 0; SNAP=await r.json();
    (SNAP.hubs||[]).forEach(h=>state.hub[h.hub]=h.price);
    (SNAP.weather?.zones||[]).forEach(z=>state.temps[z.zone]=z.tempF);
    state.wind=clamp((SNAP.wind?.actualMW??0)/25000,0,1); state.solar=clamp(Math.max(SNAP.solar?.forecastNowMW??0,SNAP.solar?.actualMW??0)/28000,0,1);
    state.demand=SNAP.demand&&SNAP.sced?clamp(SNAP.demand.mw/SNAP.sced.onlineHSL,0,1):.7;
    live.className='live'; lt.textContent=`live · ercot public api`;
    document.getElementById('sced').textContent=SNAP.sced?SNAP.sced.timestamp.slice(11,16):'—';
    document.getElementById('lam').textContent=money(SNAP.sced?.systemLambda);
    renderIntel(); renderDock();
  }catch(e){ live.className='live down'; lt.textContent='feed unavailable'; }
}
load(); setInterval(load,5*60*1000);

/* Target box on the hottest hub, the way God's Eye View locks onto a contact */
const targets=document.getElementById('targets');
const tgt=document.createElement('div'); tgt.className='target'; tgt.innerHTML='<div class="box"></div><div class="tag"></div>'; targets.appendChild(tgt);

/* Readout + animation */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
viewer.clock.onTick.addEventListener(()=>{
  pulse += reduce?0:.006;
  const c=viewer.camera.positionCartographic;
  document.getElementById('lat').textContent=C.Math.toDegrees(c.latitude).toFixed(3)+'°';
  document.getElementById('lon').textContent=C.Math.toDegrees(c.longitude).toFixed(3)+'°';
  document.getElementById('alt').textContent=fmt(c.height/1000,0)+' km';
  const hot=Object.entries(state.hub).filter(([,v])=>v!=null).sort((a,b)=>b[1]-a[1])[0];
  if(hot){ const [hub]=hot, [lon,lat,metro]=HUBS[hub];
    const w=C.SceneTransforms.worldToWindowCoordinates ? C.SceneTransforms.worldToWindowCoordinates(scene,C.Cartesian3.fromDegrees(lon,lat)) : C.SceneTransforms.wgs84ToWindowCoordinates(scene,C.Cartesian3.fromDegrees(lon,lat));
    if(w){ tgt.style.display='block'; tgt.style.left=w.x+'px'; tgt.style.top=w.y+'px'; tgt.querySelector('.tag').innerHTML=`TRK ${hub} <b>${money(hot[1])}</b> · ${metro.toUpperCase()} · HIGHEST HUB`; } else tgt.style.display='none';
  }
});

// Opening move: orbit in from space to Texas
viewer.camera.setView({destination:C.Cartesian3.fromDegrees(-99,20,18000000)});
setTimeout(()=>fly('texas',reduce?0:4.2),300);
if(window.gsap && !reduce){ gsap.from('.hud',{opacity:0,y:-8,stagger:.08,duration:.6,delay:.8,ease:'power2.out'}); }
</script>

import { mountFeed } from "/market-feed.js";
mountFeed(document.getElementById("market"), document.getElementById("dashboard"));
</script>
