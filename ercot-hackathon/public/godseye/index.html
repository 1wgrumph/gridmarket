<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>God's Eye ERCOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Cesium.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/* Visual language follows God's Eye View (MIT, bilawalsidhu/gods-eye-view): dark glass, cyan accent, mono HUD. */
:root{
  --bg-dark:#0a0a0f; --glass-bg:rgba(12,12,20,.74); --glass-border:rgba(255,255,255,.08); --glass-border-hover:rgba(255,255,255,.15);
  --accent:#00d4ff; --accent-dim:rgba(0,212,255,.15); --accent-glow:rgba(0,212,255,.4);
  --text-primary:#e8eaed; --text-secondary:rgba(232,234,237,.55); --text-dim:rgba(232,234,237,.32);
  --good:#3ddc84; --warn:#ffb020; --bad:#ff4d5e;
  --font-mono:'JetBrains Mono','SF Mono','Fira Code',monospace; --font-sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --panel-radius:16px; --btn-radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-dark);color:var(--text-primary);font-family:var(--font-sans)}
#globe{position:absolute;inset:0}
#globe .cesium-viewer-bottom{left:auto;right:12px;bottom:6px}
.cesium-credit-textContainer,.cesium-credit-logoContainer{opacity:.6}
#fx{position:absolute;inset:0;pointer-events:none;z-index:2}
body.look-crt #fx{background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
body.look-flir #globe canvas{filter:grayscale(1) contrast(1.35) brightness(1.1) sepia(.2) hue-rotate(-20deg)}
body.look-nvg #globe canvas{filter:grayscale(1) sepia(1) hue-rotate(60deg) saturate(3) brightness(1.05) contrast(1.2)}
body.look-nvg #fx{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(5,6,10,.7) 100%)}
.glass{background:var(--glass-bg);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);border:1px solid var(--glass-border);border-radius:var(--panel-radius)}
.hud{position:absolute;z-index:5}
.eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-secondary)}

.brand{top:20px;left:24px;display:flex;gap:14px;align-items:center}
.logo{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--accent);box-shadow:0 0 18px var(--accent-glow),inset 0 0 12px var(--accent-dim);position:relative}
.logo::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.brand h1{font-family:var(--font-mono);font-size:15px;letter-spacing:.24em;font-weight:700}
.brand h1 span{color:var(--accent)}
.brand .eyebrow{margin-top:4px}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--good)}
.live i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;animation:pulse 1.6s infinite}
.live.down{color:var(--bad)}
@keyframes pulse{50%{opacity:.3}}

.readout{top:20px;left:50%;transform:translateX(-50%);padding:8px 16px;display:flex;gap:22px;font-family:var(--font-mono);font-size:11px;white-space:nowrap}
.readout b{color:var(--accent);font-weight:500;margin-left:6px}

/* left rail: legend + layers */
.rail{top:84px;left:24px;width:262px;max-height:calc(100% - 170px);overflow:auto;padding:12px;display:grid;gap:10px}
.rail::-webkit-scrollbar,.intel::-webkit-scrollbar{width:6px}.rail::-webkit-scrollbar-thumb,.intel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--glass-border);border-radius:var(--btn-radius);padding:7px 10px}
.search input{flex:1;background:transparent;border:0;color:var(--text-primary);font:500 12px var(--font-sans);outline:none;min-width:0}
.search input::placeholder{color:var(--text-dim)}
.results{display:grid;gap:2px}
.results button{display:flex;gap:8px;align-items:center;justify-content:space-between;text-align:left;padding:6px 8px;border-radius:8px;border:0;background:transparent;color:var(--text-primary);font:500 12px var(--font-sans);cursor:pointer}
.results button:hover{background:rgba(255,255,255,.05)}
.results button span:last-child{font:500 10px var(--font-mono);color:var(--text-secondary);white-space:nowrap}
.legend{display:grid;gap:2px}
.lg{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:5px 6px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--text-primary);cursor:pointer;text-align:left;font:500 12px var(--font-sans)}
.lg:hover{border-color:var(--glass-border-hover);background:rgba(255,255,255,.03)}
.lg img{width:30px;height:30px}
.lg .n{font:500 10px var(--font-mono);color:var(--text-secondary);text-align:right;line-height:1.35}
.lg .n b{display:block;color:var(--text-primary);font-weight:500}
.lg.off{opacity:.35}
.row2{display:flex;gap:6px;flex-wrap:wrap}
.pill{font:500 10px var(--font-mono);letter-spacing:.08em;padding:6px 8px;border-radius:8px;border:1px solid var(--glass-border);background:transparent;color:var(--text-secondary);cursor:pointer}
.pill.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.slider{display:grid;gap:6px}
.slider label{display:flex;justify-content:space-between;font:500 10px var(--font-mono);letter-spacing:.12em;color:var(--text-secondary);text-transform:uppercase}
.slider label b{color:var(--accent);font-weight:500}
input[type=range]{width:100%;accent-color:var(--accent)}
.sep{height:1px;background:var(--glass-border)}

/* right rail: intel / drill-down */
.intel{top:84px;right:24px;width:370px;max-height:calc(100% - 170px);overflow:auto;padding:14px}
.intel h2{font-family:var(--font-mono);font-size:13px;letter-spacing:.14em;margin:6px 0 10px;color:var(--accent);text-transform:uppercase}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--glass-border);font-size:12px}
.row:last-child{border-bottom:0}
.row .k{color:var(--text-secondary)}
.row .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.sect{margin-top:14px}
.check{padding:9px 10px;border:1px solid var(--glass-border);border-radius:10px;margin-top:8px}
.check .q{font-size:12px;line-height:1.4}
.check .m{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font:500 10px var(--font-mono);letter-spacing:.08em;color:var(--text-secondary);text-transform:uppercase}
.check .p{font:700 16px var(--font-mono)}
.bar{height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%}
.note{font-size:11px;color:var(--text-dim);margin-top:10px;line-height:1.45}
.note a{color:var(--accent)}

.p-head{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}
.p-head img{width:56px;height:56px}
.p-head h3{font:600 17px/1.2 var(--font-sans);letter-spacing:-.01em}
.p-head .sub{font-size:12px;color:var(--text-secondary);margin-top:3px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{font:500 10px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 7px;border-radius:6px;border:1px solid var(--glass-border);color:var(--text-secondary)}
.badge.accent{border-color:var(--accent);color:var(--accent)}
.badge.warn{border-color:var(--warn);color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
.tile{border:1px solid var(--glass-border);border-radius:10px;padding:8px 9px}
.tile .k{font:500 9px var(--font-mono);letter-spacing:.14em;color:var(--text-secondary);text-transform:uppercase}
.tile .v{font:600 16px var(--font-mono);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:10px;color:var(--text-dim);margin-top:1px}
.mix{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:8px;background:rgba(255,255,255,.06)}
.mix i{display:block;height:100%}
.mixkey{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font:500 10px var(--font-mono);color:var(--text-secondary)}
.mixkey span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--c);margin-right:5px}
.livebox{border:1px solid rgba(0,212,255,.35);background:rgba(0,212,255,.05);border-radius:12px;padding:10px;margin-top:8px}
.livebox .big{font:700 22px var(--font-mono);font-variant-numeric:tabular-nums}
.livebox .lbl{font:500 10px var(--font-mono);letter-spacing:.12em;color:var(--text-secondary);text-transform:uppercase}
.spark{display:block;width:100%;height:34px;margin-top:6px}
table.units{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
table.units th{font:500 9px var(--font-mono);letter-spacing:.12em;color:var(--text-secondary);text-transform:uppercase;text-align:left;padding:5px 4px;border-bottom:1px solid var(--glass-border)}
table.units td{padding:6px 4px;border-bottom:1px solid var(--glass-border);vertical-align:top}
table.units td.n{font-family:var(--font-mono);text-align:right;white-space:nowrap}
.tblwrap{overflow-x:auto}
.back{font:500 10px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--glass-border);border-radius:8px;background:transparent;color:var(--text-secondary);padding:5px 8px;cursor:pointer}
.back:hover{border-color:var(--accent);color:var(--accent)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}

.dash{display:inline-block;margin-top:6px;font:500 10px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);text-decoration:none}
.dash:hover{text-decoration:underline}
[hidden]{display:none!important}
.market{left:24px;bottom:84px;width:300px;max-height:34vh;overflow:auto;padding:12px}
.mf-title{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-secondary);margin:2px 0 6px}
.mf-strip,.mf-alerts{list-style:none;margin:0 0 10px;padding:0;font-size:12px}
.mf-strip li,.mf-alerts li{padding:5px 0;border-bottom:1px solid var(--glass-border)}
.mf-strip li:last-child,.mf-alerts li:last-child{border-bottom:0}
.mf-strip b{color:var(--accent);font-weight:500}
.mf-alerts b{float:right;font-family:var(--font-mono);color:var(--bad)}

.dock{left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;max-width:calc(100vw - 32px);overflow-x:auto}
.dock button{flex:none;font:500 11px var(--font-mono);letter-spacing:.08em;padding:9px 12px;border-radius:var(--btn-radius);border:1px solid var(--glass-border);background:transparent;color:var(--text-primary);cursor:pointer;transition:all .15s;white-space:nowrap}
.dock button:hover{border-color:var(--accent);color:var(--accent)}
.dock button b{color:var(--accent);font-weight:500;margin-left:6px}

.target{position:absolute;z-index:4;pointer-events:none;transform:translate(-50%,-50%);display:none}
.target .box{width:52px;height:52px;border:1px solid var(--accent);box-shadow:0 0 10px var(--accent-glow)}
.target .tag{position:absolute;left:60px;top:-2px;font:500 10px var(--font-mono);letter-spacing:.1em;color:var(--accent);white-space:nowrap;background:rgba(10,10,15,.72);padding:2px 5px;border-left:2px solid var(--accent)}
.target .tag b{color:var(--text-primary);font-weight:500}
#tip{position:absolute;z-index:6;pointer-events:none;display:none;font:500 11px var(--font-mono);background:rgba(10,10,15,.88);border:1px solid var(--glass-border);border-radius:8px;padding:6px 8px;white-space:nowrap}
#tip b{color:var(--accent);font-weight:500}

button:focus-visible,input:focus-visible{outline:2px solid var(--text-primary);outline-offset:2px}
@media (max-width:900px){
  .readout{display:none}
  .rail{top:auto;bottom:84px;left:12px;right:12px;width:auto;max-height:32vh}
  .intel{top:70px;right:12px;left:12px;width:auto;max-height:38vh}
  .brand{left:12px;top:12px}.brand h1{font-size:12px}
  .market{left:12px;right:12px;bottom:140px;width:auto;max-height:22vh}
}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
</style>
</head>
<body>
<div id="globe"></div>
<div class="vignette"></div>
<div id="fx"></div>
<div id="targets"><div class="target" id="tgt"><div class="box"></div><div class="tag"></div></div></div>
<div id="tip"></div>

<div class="hud brand">
  <div class="logo"></div>
  <div><h1>GOD'S EYE <span>// ERCOT</span></h1><div class="eyebrow"><span class="live" id="live"><i></i><span id="liveText">acquiring feed</span></span></div><a class="dash" id="dashboard" href="#" hidden>GridMarket dashboard →</a></div>
</div>
<div class="hud readout glass">
  <span>LAT<b id="lat">—</b></span><span>LON<b id="lon">—</b></span><span>ALT<b id="alt">—</b></span><span>SCED<b id="sced">—</b></span><span>λ<b id="lam">—</b></span><span>PLANTS<b id="shown">—</b></span>
</div>

<div class="hud rail glass" id="rail">
  <div class="search"><span class="eyebrow">⌕</span><input id="q" type="search" placeholder="Find a plant, operator or county" autocomplete="off" /></div>
  <div class="results" id="results"></div>
  <div class="eyebrow">// power plants by resource</div>
  <div class="legend" id="legend"></div>
  <div class="slider">
    <label for="minmw">Minimum size <b id="minmwv">10 MW</b></label>
    <input id="minmw" type="range" min="0" max="7" step="1" value="2" />
  </div>
  <div class="row2">
    <button class="pill on" id="ercotOnly">ERCOT grid only</button>
    <button class="pill on" id="labelsBtn">Labels</button>
  </div>
  <div class="sep"></div>
  <div class="eyebrow">// live layers</div>
  <div class="row2" id="layerPills"></div>
  <div class="eyebrow">// sensor look</div>
  <div class="row2" id="looks">
    <button class="pill on" data-look="none">STD</button><button class="pill" data-look="flir">FLIR</button><button class="pill" data-look="nvg">NVG</button><button class="pill" data-look="crt">CRT</button>
  </div>
</div>

<div class="hud intel glass" id="intel"><div class="eyebrow">// intel feed</div><h2>Acquiring ERCOT</h2></div>
<div class="hud dock glass" id="dock"></div>
<div class="hud market glass" id="market" hidden aria-label="Market activity and router checks (baseline rules)"></div>

<script>
const fmt=(n,d=0)=>n==null||!isFinite(n)?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=n=>n==null||!isFinite(n)?'—':(n<0?'−$':'$')+fmt(Math.abs(n),2);
const signed=(n,d=0)=>n==null||!isFinite(n)?'—':(n>0?'+':n<0?'−':'')+fmt(Math.abs(n),d);
const band=p=>p>=.8?'#3ddc84':p>=.5?'#ffb020':'#8a8f98';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C=Cesium;
const API=location.protocol==='file:'||window.__PREVIEW?'https://ercot-hackathon.jordan-691.workers.dev':'';

/* ---------- resource types: colour + dedicated silhouette ---------- */
const TYPES={
  nuclear:{label:'Nuclear',color:'#c792ff'},
  coal:{label:'Coal',color:'#a1887f'},
  gas:{label:'Natural gas',color:'#ff9f43'},
  oil:{label:'Petroleum',color:'#d98ca0'},
  wind:{label:'Wind',color:'#e8eaed'},
  solar:{label:'Solar',color:'#ffd24a'},
  storage:{label:'Battery storage',color:'#5eead4'},
  hydro:{label:'Hydroelectric',color:'#4fa3ff'},
  biomass:{label:'Biomass & landfill gas',color:'#9ccc65'},
  other:{label:'Other',color:'#9aa0a6'}
};
const ORDER=['nuclear','coal','gas','oil','wind','solar','storage','hydro','biomass','other'];
function glyph(t){
  const c=TYPES[t].color, k='#0a0a0f';
  const g={
    nuclear:`<path d="M17 58 C22 42 23 28 19 10 L45 10 C41 28 42 42 47 58 Z" fill="${c}" stroke="${k}" stroke-width="2"/><path d="M20 20 C26 22 38 22 44 20" stroke="${k}" stroke-width="1.5" fill="none" opacity=".5"/><circle cx="26" cy="7" r="4" fill="#fff" opacity=".7"/><circle cx="33" cy="4" r="4.5" fill="#fff" opacity=".6"/><circle cx="40" cy="7" r="3.5" fill="#fff" opacity=".5"/>`,
    coal:`<rect x="8" y="34" width="34" height="24" fill="${c}" stroke="${k}" stroke-width="2"/><rect x="44" y="12" width="7" height="46" fill="${c}" stroke="${k}" stroke-width="2"/><rect x="54" y="20" width="6" height="38" fill="${c}" stroke="${k}" stroke-width="2"/><rect x="14" y="40" width="6" height="6" fill="${k}" opacity=".45"/><rect x="26" y="40" width="6" height="6" fill="${k}" opacity=".45"/><circle cx="48" cy="7" r="4" fill="#6b6b6b" opacity=".85"/><circle cx="54" cy="4" r="3.5" fill="#6b6b6b" opacity=".7"/>`,
    gas:`<path d="M6 58 L6 36 L30 28 L30 58 Z" fill="${c}" stroke="${k}" stroke-width="2"/><rect x="30" y="38" width="18" height="20" fill="${c}" stroke="${k}" stroke-width="2"/><rect x="50" y="16" width="8" height="42" fill="${c}" stroke="${k}" stroke-width="2"/><path d="M54 4 C58 9 58 12 54 15 C50 12 50 9 54 4 Z" fill="#ffd24a" stroke="${k}" stroke-width="1"/><rect x="12" y="44" width="12" height="4" fill="${k}" opacity=".4"/>`,
    oil:`<rect x="8" y="30" width="26" height="28" rx="3" fill="${c}" stroke="${k}" stroke-width="2"/><ellipse cx="21" cy="30" rx="13" ry="4" fill="${c}" stroke="${k}" stroke-width="2"/><path d="M47 22 C53 32 56 38 56 44 A9 9 0 0 1 38 44 C38 38 41 32 47 22 Z" fill="${c}" stroke="${k}" stroke-width="2"/><rect x="36" y="52" width="22" height="6" fill="${c}" stroke="${k}" stroke-width="2"/>`,
    wind:`<path d="M30.5 26 L33.5 26 L35 60 L29 60 Z" fill="${c}" stroke="${k}" stroke-width="1.5"/><circle cx="32" cy="24" r="3.2" fill="${c}" stroke="${k}" stroke-width="1.5"/><path d="M32 21 L30 2 L34.5 4 Z" fill="${c}" stroke="${k}" stroke-width="1.5"/><path d="M34.6 25.5 L51 35 L47 38 Z" fill="${c}" stroke="${k}" stroke-width="1.5"/><path d="M29.4 25.5 L13 35 L12.5 30 Z" fill="${c}" stroke="${k}" stroke-width="1.5"/>`,
    solar:`<circle cx="50" cy="12" r="6" fill="${c}" stroke="${k}" stroke-width="1.5"/><path d="M4 50 L16 32 L42 32 L30 50 Z" fill="${c}" stroke="${k}" stroke-width="2"/><path d="M10 41 L36 41 M23 32 L17 50 M29.5 32 L23.5 50 M16.5 32 L10.5 50" stroke="${k}" stroke-width="1.2" opacity=".55"/><path d="M26 58 L36 44 L60 44 L50 58 Z" fill="${c}" stroke="${k}" stroke-width="2"/><path d="M31 51 L55 51 M42 44 L37 58 M48 44 L43 58" stroke="${k}" stroke-width="1.2" opacity=".55"/>`,
    storage:`<rect x="6" y="26" width="52" height="32" rx="3" fill="${c}" stroke="${k}" stroke-width="2"/><rect x="24" y="20" width="16" height="6" fill="${c}" stroke="${k}" stroke-width="2"/><path d="M34 31 L25 44 L32 44 L29 54 L39 40 L32 40 Z" fill="${k}" opacity=".65"/><path d="M12 32 L12 52 M52 32 L52 52" stroke="${k}" stroke-width="1.2" opacity=".4"/>`,
    hydro:`<path d="M6 58 L14 22 L50 22 L58 58 Z" fill="${c}" stroke="${k}" stroke-width="2"/><path d="M14 22 L50 22" stroke="${k}" stroke-width="3"/><path d="M22 34 L22 50 M32 34 L32 50 M42 34 L42 50" stroke="${k}" stroke-width="2" opacity=".45"/><path d="M4 16 Q12 10 20 16 T36 16 T52 16 T62 14" stroke="${c}" stroke-width="3" fill="none"/>`,
    biomass:`<path d="M14 56 C8 36 20 16 44 12 C48 34 38 52 14 56 Z" fill="${c}" stroke="${k}" stroke-width="2"/><path d="M14 56 C22 42 30 32 40 20" stroke="${k}" stroke-width="1.6" fill="none" opacity=".6"/><rect x="48" y="30" width="7" height="28" fill="${c}" stroke="${k}" stroke-width="2"/>`,
    other:`<path d="M32 8 L53 20 L53 44 L32 56 L11 44 L11 20 Z" fill="${c}" stroke="${k}" stroke-width="2"/><circle cx="32" cy="32" r="7" fill="${k}" opacity=".45"/>`
  }[t];
  return `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><ellipse cx="32" cy="60" rx="24" ry="3" fill="#000" opacity=".45"/>${g}</svg>`;
}
const ICON={}; ORDER.forEach(t=>ICON[t]='data:image/svg+xml;utf8,'+encodeURIComponent(glyph(t)));

/* ---------- geography ---------- */
const HUBS={HB_NORTH:[-96.80,32.78,'Dallas–Fort Worth'],HB_HOUSTON:[-95.37,29.76,'Houston'],HB_SOUTH:[-98.49,29.42,'San Antonio'],HB_WEST:[-102.08,31.99,'Midland–Odessa']};

const km=(a,b)=>{const R=6371,toR=Math.PI/180,dLat=(b[1]-a[1])*toR,dLon=(b[0]-a[0])*toR,x=Math.sin(dLat/2)**2+Math.cos(a[1]*toR)*Math.cos(b[1]*toR)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x));};
const nearest=(pt,obj)=>Object.entries(obj).map(([k,v])=>[k,km(pt,v)]).sort((a,b)=>a[1]-b[1])[0];

/* ---------- power plants (EIA-860) ---------- */
let PLANTS=[], META=null, selected=null;
const filt={types:new Set(ORDER),minIdx:2,ercotOnly:true,labels:true};
const MINS=[0,5,10,25,50,100,250,500];
const plantEnt=new Map();

function plantSize(mw){ return clamp(18+Math.sqrt(mw)*1.25,20,86); }
function addPlants(){
  for(const p of PLANTS){
    const t=TYPES[p.prim]; const col=C.Color.fromCssColorString(t.color);
    const e=G.plants.entities.add({id:'plant-'+p.code,position:C.Cartesian3.fromDegrees(p.lon,p.lat,0),
      billboard:{image:ICON[p.prim],width:plantSize(p.mw),height:plantSize(p.mw),verticalOrigin:C.VerticalOrigin.BOTTOM,
        scaleByDistance:new C.NearFarScalar(4e4,1.35,3.2e6,.38),disableDepthTestDistance:Number.POSITIVE_INFINITY,
        color:p.ba==='ERCO'?C.Color.WHITE:C.Color.WHITE.withAlpha(.5)},
      label:{text:p.name.toUpperCase(),font:'500 10px "JetBrains Mono", ui-monospace, Menlo, monospace',fillColor:col,showBackground:true,backgroundColor:INK.withAlpha(.72),backgroundPadding:new C.Cartesian2(5,3),
        verticalOrigin:C.VerticalOrigin.TOP,pixelOffset:new C.Cartesian2(0,6),disableDepthTestDistance:Number.POSITIVE_INFINITY,
        distanceDisplayCondition:new C.DistanceDisplayCondition(0,p.mw>=1500?2.2e6:p.mw>=800?9e5:p.mw>=300?3.5e5:1.2e5),show:true}});
    e.plant=p; plantEnt.set(p.code,e);
  }
}
function applyFilter(){
  const min=MINS[filt.minIdx]; let n=0, mw=0;
  for(const p of PLANTS){ const e=plantEnt.get(p.code);
    const on=filt.types.has(p.prim)&&p.mw>=min&&(!filt.ercotOnly||p.ba==='ERCO');
    e.show=on; e.label.show=filt.labels; if(on){n++;mw+=p.mw;} }
  document.getElementById('shown').textContent=`${fmt(n)} · ${fmt(mw/1000,1)} GW`;
  document.getElementById('minmwv').textContent=min?`${min} MW`:'all';
  renderLegend();
}

/* legend with counts + capacity, doubling as layer toggles */
function renderLegend(){
  const min=MINS[filt.minIdx]; const agg={}; ORDER.forEach(t=>agg[t]={n:0,mw:0});
  PLANTS.forEach(p=>{ if(p.mw>=min&&(!filt.ercotOnly||p.ba==='ERCO')){agg[p.prim].n++;agg[p.prim].mw+=p.mw;} });
  document.getElementById('legend').innerHTML=ORDER.filter(t=>agg[t].n).map(t=>`<button class="lg ${filt.types.has(t)?'':'off'}" data-t="${t}" aria-pressed="${filt.types.has(t)}"><img src="${ICON[t]}" alt=""><span>${TYPES[t].label}</span><span class="n"><b>${fmt(agg[t].mw/1000,1)} GW</b>${fmt(agg[t].n)} plants</span></button>`).join('');
  document.querySelectorAll('.lg').forEach(b=>b.onclick=()=>{ const t=b.dataset.t; filt.types.has(t)?filt.types.delete(t):filt.types.add(t); applyFilter(); });
}
document.getElementById('minmw').oninput=e=>{filt.minIdx=+e.target.value;applyFilter();};
document.getElementById('ercotOnly').onclick=e=>{filt.ercotOnly=!filt.ercotOnly;e.currentTarget.classList.toggle('on',filt.ercotOnly);applyFilter();};
document.getElementById('labelsBtn').onclick=e=>{filt.labels=!filt.labels;e.currentTarget.classList.toggle('on',filt.labels);applyFilter();};

/* ---------- plant drill-down ---------- */
function spark(series,color){
  const v=(series||[]).filter(x=>x!=null&&isFinite(x)); if(v.length<2) return '';
  const mn=Math.min(...v),mx=Math.max(...v),W=300,H=34;
  const pts=v.map((y,i)=>`${(i/(v.length-1)*W).toFixed(1)},${(H-3-((y-mn)/((mx-mn)||1))*(H-6)).toFixed(1)}`).join(' ');
  const last=pts.split(' ').pop().split(',');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="0,${H} ${pts} ${W},${H}" fill="${color}" fill-opacity=".12"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="2.8" fill="${color}"/></svg>`;
}
const CHEM={LIB:'lithium-ion',NIB:'nickel-based',PB:'lead-acid',NAB:'sodium-based',FLB:'flow battery',MAB:'metal-air',OTH:'other'};
const STAT_BA={ERCO:'ERCOT',SWPP:'Southwest Power Pool',MISO:'MISO',EPE:'El Paso Electric (WECC)',PNM:'PNM (WECC)'};
function plantHTML(p){
  const t=TYPES[p.prim];
  const yrs=p.units.map(u=>u.yr).filter(Boolean); const first=yrs.length?Math.min(...yrs):null, last=yrs.length?Math.max(...yrs):null;
  const summer=p.units.reduce((a,u)=>a+(u.sum||0),0);
  const hub=nearest([p.lon,p.lat],Object.fromEntries(Object.entries(HUBS).map(([k,v])=>[k,[v[0],v[1]]])));
  const zone=nearest([p.lon,p.lat],ZONES);
  const mixTotal=Object.values(p.cap).reduce((a,b)=>a+b,0);
  const w=p.units.find(u=>u.wind)?.wind, sol=p.units.filter(u=>u.solar), st=p.units.filter(u=>u.stor);
  const retiring=p.units.filter(u=>u.ret);
  let fleet='';
  if(SNAP&&(p.prim==='wind'||p.prim==='solar')){
    const f=p.prim==='wind'?SNAP.wind:SNAP.solar;
    const installed=PLANTS.filter(x=>x.ba==='ERCO').reduce((a,x)=>a+(x.cap[p.prim]||0),0);
    const util=f&&f.actualMW!=null&&installed?f.actualMW/installed:null;
    fleet=`<div class="sect eyebrow">// ercot ${p.prim} fleet now</div>
      <div class="row"><span class="k">Fleet output · HE${f?.actualHE??'—'}</span><span class="v">${fmt(f?.actualMW)} MW</span></div>
      <div class="row"><span class="k">Fleet forecast error</span><span class="v">${signed(f?.errorMW)} MW</span></div>
      <div class="row"><span class="k">Installed ERCOT ${p.prim} (EIA-860)</span><span class="v">${fmt(installed/1000,1)} GW</span></div>
      ${util!=null?`<div class="row"><span class="k">Fleet running at</span><span class="v">${fmt(util*100,1)}% of installed</span></div>
      <div class="row"><span class="k">This plant at the fleet rate</span><span class="v">≈ ${fmt(p.cap[p.prim]*util)} MW</span></div>`:''}
      <div class="note">ERCOT publishes wind and solar output system-wide, not per plant, so the last line is an estimate.</div>`;
  }
  return `<div class="topline"><div class="eyebrow">// plant drill-down · EIA ${p.code}</div><button class="back" id="back">← System</button></div>
  <div class="p-head" style="margin-top:10px"><img src="${ICON[p.prim]}" alt="${t.label}"><div><h3>${esc(p.name)}</h3><div class="sub">${esc(p.op)} · ${esc(p.county)} County${p.city?` · ${esc(p.city)}`:''}</div></div></div>
  <div class="badges"><span class="badge" style="border-color:${t.color};color:${t.color}">${t.label}</span><span class="badge ${p.ba==='ERCO'?'accent':'warn'}">${STAT_BA[p.ba]||esc(p.ba)}</span>${p.sector?`<span class="badge">${esc(p.sector)}</span>`:''}${p.planned.length?`<span class="badge warn">${p.planned.length} unit(s) planned</span>`:''}</div>
  <div class="tiles">
    <div class="tile"><div class="k">Nameplate</div><div class="v">${fmt(p.mw)}</div><div class="s">MW</div></div>
    <div class="tile"><div class="k">Summer</div><div class="v">${fmt(summer)}</div><div class="s">MW net</div></div>
    <div class="tile"><div class="k">Units</div><div class="v">${p.units.length}</div><div class="s">${first?(first===last?`online ${first}`:`${first}–${last}`):''}</div></div>
  </div>
  ${Object.keys(p.cap).length>1?`<div class="sect eyebrow">// capacity mix</div><div class="mix">${Object.entries(p.cap).map(([k,v])=>`<i style="width:${v/mixTotal*100}%;background:${TYPES[k].color}" title="${TYPES[k].label} ${fmt(v)} MW"></i>`).join('')}</div><div class="mixkey">${Object.entries(p.cap).map(([k,v])=>`<span style="--c:${TYPES[k].color}">${TYPES[k].label} ${fmt(v)} MW</span>`).join('')}</div>`:''}
  <div class="sect eyebrow">// live market</div>
  <div id="liveMarket">${p.ba!=='ERCO'?`<div class="note">This plant sits in ${STAT_BA[p.ba]||p.ba}, outside the ERCOT market, so ERCOT prices don't apply to it.</div>`:p.nodes.length?'<div class="livebox"><div class="lbl">Loading settlement point…</div></div>':''}</div>
  ${p.ba==='ERCO'?`<div class="row"><span class="k">Nearest hub · ${Math.round(hub[1])} km</span><span class="v">${hub[0]} ${money(state.hub[hub[0]])}</span></div>
  <div class="row"><span class="k">Weather zone (nearest, approx.)</span><span class="v">${zone[0]} ${state.temps[zone[0]]!=null?fmt(state.temps[zone[0]],1)+'°F':''}</span></div>`:''}
  ${fleet}
  ${w?`<div class="sect eyebrow">// wind turbines</div>
    <div class="row"><span class="k">Turbines</span><span class="v">${fmt(p.units.reduce((a,u)=>a+(u.wind?.n||0),0))}</span></div>
    <div class="row"><span class="k">Model</span><span class="v">${esc(w.mfr||'—')} ${esc(w.model||'')}</span></div>
    <div class="row"><span class="k">Hub height</span><span class="v">${w.hub?fmt(w.hub)+' ft':'—'}</span></div>
    <div class="row"><span class="k">Wind quality class</span><span class="v">${w.cls??'—'}</span></div>`:''}
  ${sol.length?`<div class="sect eyebrow">// solar array</div>
    <div class="row"><span class="k">Tracking</span><span class="v">${esc([...new Set(sol.map(u=>u.solar.track).filter(Boolean))].join(', ')||'—')}</span></div>
    <div class="row"><span class="k">DC capacity</span><span class="v">${fmt(sol.reduce((a,u)=>a+(u.solar.dc||0),0))} MWdc</span></div>
    <div class="row"><span class="k">Bifacial modules</span><span class="v">${sol.some(u=>u.solar.bifacial)?'yes':'no'}</span></div>`:''}
  ${st.length?`<div class="sect eyebrow">// battery storage</div>
    <div class="row"><span class="k">Energy capacity</span><span class="v">${fmt(st.reduce((a,u)=>a+(u.stor.mwh||0),0))} MWh</span></div>
    <div class="row"><span class="k">Duration</span><span class="v">${esc([...new Set(st.map(u=>u.stor.hrs).filter(Boolean))].map(h=>h+' h').join(', ')||'—')}</span></div>
    <div class="row"><span class="k">Chemistry</span><span class="v">${esc([...new Set(st.map(u=>CHEM[u.stor.chem]||u.stor.chem).filter(Boolean))].join(', ')||'—')}</span></div>
    <div class="row"><span class="k">Reported uses</span><span class="v" style="max-width:60%">${esc([...new Set(st.flatMap(u=>u.stor.uses))].join(', ')||'—')}</span></div>`:''}
  <div class="sect eyebrow">// grid connection</div>
  <div class="row"><span class="k">Balancing authority</span><span class="v">${esc(p.baName||p.ba)}</span></div>
  <div class="row"><span class="k">Transmission owner</span><span class="v" style="max-width:62%">${esc(p.to||'—')}</span></div>
  <div class="row"><span class="k">Interconnection voltage</span><span class="v">${p.kv.length?p.kv.map(k=>fmt(k)+' kV').join(' / '):'—'}</span></div>
  ${p.water?`<div class="row"><span class="k">Water source</span><span class="v" style="max-width:62%">${esc(p.water)}</span></div>`:''}
  ${p.pipes.length?`<div class="row"><span class="k">Gas pipelines</span><span class="v" style="max-width:62%">${esc(p.pipes.join(', '))}</span></div>`:''}
  <div class="row"><span class="k">Location</span><span class="v">${p.lat.toFixed(4)}°, ${p.lon.toFixed(4)}°</span></div>
  <div class="sect eyebrow">// generating units (${p.units.length})</div>
  <div class="tblwrap"><table class="units"><thead><tr><th>Unit</th><th>Technology</th><th style="text-align:right">MW</th><th style="text-align:right">Online</th></tr></thead><tbody>
  ${p.units.slice(0,14).map(u=>`<tr><td class="n" style="text-align:left">${esc(u.id)}</td><td>${esc(u.tech)}${u.chp?' · CHP':''}${u.ret?` <span style="color:var(--warn)">· retires ${u.ret}</span>`:''}${u.node?`<div style="font:500 10px var(--font-mono);color:var(--accent)">${esc(u.node)}</div>`:''}</td><td class="n">${fmt(u.mw,1)}</td><td class="n">${u.yr??'—'}</td></tr>`).join('')}
  </tbody></table></div>
  ${p.units.length>14?`<div class="note">+ ${p.units.length-14} more units</div>`:''}
  ${retiring.length?`<div class="note" style="color:var(--warn)">${retiring.length} unit(s) report a planned retirement year.</div>`:''}
  ${p.planned.length?`<div class="sect eyebrow">// planned additions</div>${p.planned.map(u=>`<div class="row"><span class="k">${esc(u.tech)}</span><span class="v">${fmt(u.mw)} MW · ${u.yr??'—'}<div style="font-size:10px;color:var(--text-dim)">${esc(u.status)}</div></span></div>`).join('')}`:''}
  <div class="note">Source: EIA-860 2025 early release, plant ${p.code}. <a href="https://www.eia.gov/electricity/data/browser/#/plant/${p.code}" target="_blank" rel="noopener">Open in EIA Electricity Data Browser ↗</a>${p.nodes.length?`<br>Settlement point${p.nodes.length>1?'s':''}: ${p.nodes.map(esc).join(', ')} (${p.nodeSrc==='EIA-860'?'from EIA-860':'matched by ERCOT naming'}).`:''}</div>`;
}
async function fetchNodes(sps){
  const r=await fetch(API+'/api/node?sp='+encodeURIComponent(sps.join(',')));
  if(r.ok) return r.json();
  if(r.status!==404) throw new Error(r.status);
  // Fallback: build the same answer from the generic ERCOT report proxy
  const now=new Date(), ct=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(now).reduce((a,x)=>(a[x.type]=x.value,a),{});
  const date=`${ct.year}-${ct.month}-${ct.day}`, he=Math.min(24,+ct.hour+1);
  const rows=j=>{const f=(j.fields||[]).map(x=>x.name);return (j.data||[]).map(r=>Object.fromEntries(f.map((n,i)=>[n,r[i]])));};
  const out={nodes:[],errors:{}};
  for(const sp of sps){ const n={sp,rt:null,da:null};
    try{ const j=await (await fetch(`${API}/api/report/np6-905-cd/spp_node_zone_hub?deliveryDateFrom=${date}&deliveryDateTo=${date}&settlementPoint=${encodeURIComponent(sp)}&size=200`)).json();
      const rt=rows(j).sort((a,b)=>a.deliveryHour*10+a.deliveryInterval-(b.deliveryHour*10+b.deliveryInterval)); const l=rt[rt.length-1];
      if(l) n.rt={price:l.settlementPointPrice,hour:l.deliveryHour,interval:l.deliveryInterval,series:rt.slice(-24).map(x=>x.settlementPointPrice)}; }catch(e){out.errors[sp+':rt']=e.message;}
    try{ const j=await (await fetch(`${API}/api/report/np4-190-cd/dam_stlmnt_pnt_prices?deliveryDateFrom=${date}&deliveryDateTo=${date}&settlementPoint=${encodeURIComponent(sp)}&size=30`)).json();
      const h=rows(j).find(x=>Number(String(x.hourEnding).slice(0,2))===he); if(h) n.da={price:h.settlementPointPrice,he}; }catch(e){out.errors[sp+':da']=e.message;}
    out.nodes.push(n); }
  return out;
}
let reqId=0;
async function loadNode(p){
  if(p.ba!=='ERCO'||!p.nodes.length) return;
  const my=++reqId, box=document.getElementById('liveMarket');
  try{
    const d=await fetchNodes(p.nodes.slice(0,4)); if(my!==reqId) return;
    const hub=nearest([p.lon,p.lat],Object.fromEntries(Object.entries(HUBS).map(([k,v])=>[k,[v[0],v[1]]])))[0];
    box.innerHTML=d.nodes.map(n=>{
      const rt=n.rt?.price, basis=rt!=null&&state.hub[hub]!=null?rt-state.hub[hub]:null, dart=rt!=null&&n.da?.price!=null?rt-n.da.price:null;
      const col=rt==null?'#8a8f98':priceColor(rt).toCssColorString();
      return `<div class="livebox"><div class="lbl">${esc(n.sp)} · real-time SPP${n.rt?` · HE${n.rt.hour} int ${n.rt.interval}`:''}</div>
        <div class="big" style="color:${col}">${n.rt?money(rt):'no data today'}<span style="font-size:11px;color:var(--text-secondary);font-weight:500"> /MWh</span></div>
        ${spark(n.rt?.series,col)}
        <div class="row"><span class="k">Day-ahead · HE${n.da?.he??'—'}</span><span class="v">${money(n.da?.price)}</span></div>
        <div class="row"><span class="k">DART (RT − DA)</span><span class="v">${signed(dart,2)}</span></div>
        <div class="row"><span class="k">Basis vs ${hub}</span><span class="v">${signed(basis,2)}</span></div></div>`;
    }).join('')+(d.errors&&Object.keys(d.errors).length?`<div class="note">Some points didn't respond: ${esc(Object.keys(d.errors).join(', '))}</div>`:'');
  }catch(e){ if(my===reqId) box.innerHTML=`<div class="note">Live settlement price unavailable (${esc(e.message)}). Try again in a minute.</div>`; }
}
function selectPlant(code,fly=true){
  const p=PLANTS.find(x=>x.code===code); if(!p) return;
  selected=p;
  if(!filt.types.has(p.prim)||(filt.ercotOnly&&p.ba!=='ERCO')||p.mw<MINS[filt.minIdx]){ filt.types.add(p.prim); if(p.ba!=='ERCO'){filt.ercotOnly=false;document.getElementById('ercotOnly').classList.remove('on');} if(p.mw<MINS[filt.minIdx]){filt.minIdx=0;document.getElementById('minmw').value=0;} applyFilter(); }
  intel.innerHTML=plantHTML(p); intel.scrollTop=0;
  document.getElementById('back').onclick=()=>{selected=null;renderSystem();history.replaceState(null,'',location.pathname);};
  if(fly) flyTo(p.lon,p.lat,clamp(9000+Math.sqrt(p.mw)*700,12000,60000),-32,2.2);
  history.replaceState(null,'','#plant-'+p.code);
  loadNode(p);
}

/* ---------- picking + hover ---------- */
const handler=new C.ScreenSpaceEventHandler(scene.canvas);
handler.setInputAction(ev=>{ const hit=scene.pick(ev.position); if(hit&&hit.id&&hit.id.plant) selectPlant(hit.id.plant.code); },C.ScreenSpaceEventType.LEFT_CLICK);
const tip=document.getElementById('tip');
handler.setInputAction(ev=>{ const hit=scene.pick(ev.endPosition);
  if(hit&&hit.id&&hit.id.plant){ const p=hit.id.plant; tip.style.display='block'; tip.style.left=(ev.endPosition.x+14)+'px'; tip.style.top=(ev.endPosition.y+12)+'px';
    tip.innerHTML=`${esc(p.name)} · <b>${fmt(p.mw)} MW</b> ${TYPES[p.prim].label.toLowerCase()}`; scene.canvas.style.cursor='pointer'; }
  else { tip.style.display='none'; scene.canvas.style.cursor=''; } },C.ScreenSpaceEventType.MOUSE_MOVE);

/* ---------- data loading ---------- */
async function loadPlants(){
  const d=window.__PLANTS||await (await fetch(API+'/data/tx_plants.json')).json(); META=d.meta; PLANTS=d.plants;
  addPlants(); applyFilter(); renderSystem();
  const m=location.hash.match(/plant-(\d+)/); if(m) setTimeout(()=>selectPlant(+m[1]),1800);
}
async function loadSnap(){
  const live=document.getElementById('live'), lt=document.getElementById('liveText');
  try{ const r=await fetch(API+'/api/snapshot'); if(!r.ok) throw 0; SNAP=await r.json();
    (SNAP.hubs||[]).forEach(h=>state.hub[h.hub]=h.price); (SNAP.weather?.zones||[]).forEach(z=>state.temps[z.zone]=z.tempF);
    live.className='live'; lt.textContent='live · ercot public api + eia-860';
    document.getElementById('sced').textContent=SNAP.sced?SNAP.sced.timestamp.slice(11,16):'—';
    document.getElementById('lam').textContent=money(SNAP.sced?.systemLambda);
    renderDock(); if(!selected) renderSystem(); else if(!document.querySelector('#liveMarket .livebox .big')) selectPlant(selected.code,false);
  }catch(e){ live.className='live down'; lt.textContent='live feed unavailable'; }
}
loadPlants().catch(e=>{intel.innerHTML=`<div class="note">Couldn't load plant data: ${esc(e.message)}</div>`;});
loadSnap(); setInterval(loadSnap,5*60*1000);

/* ---------- target lock + readout ---------- */
const tgt=document.getElementById('tgt'); const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const toWin=(pos)=>(C.SceneTransforms.worldToWindowCoordinates||C.SceneTransforms.wgs84ToWindowCoordinates)(scene,pos);
viewer.clock.onTick.addEventListener(()=>{
  const c=viewer.camera.positionCartographic;
  document.getElementById('lat').textContent=C.Math.toDegrees(c.latitude).toFixed(3)+'°';
  document.getElementById('lon').textContent=C.Math.toDegrees(c.longitude).toFixed(3)+'°';
  document.getElementById('alt').textContent=fmt(c.height/1000,0)+' km';
  let lon,lat,tag;
  if(selected){ lon=selected.lon; lat=selected.lat; tag=`TRK ${esc(selected.name.toUpperCase())} <b>${fmt(selected.mw)} MW</b> · ${TYPES[selected.prim].label.toUpperCase()}`; }
  else { const hot=Object.entries(state.hub).filter(([,v])=>v!=null).sort((a,b)=>b[1]-a[1])[0]; if(hot){ [lon,lat]=HUBS[hot[0]]; tag=`TRK ${hot[0]} <b>${money(hot[1])}</b> · HIGHEST HUB`; } }
  if(lon==null){tgt.style.display='none';return;}
  const w=toWin(C.Cartesian3.fromDegrees(lon,lat,0));
  if(w){ tgt.style.display='block'; tgt.style.left=w.x+'px'; tgt.style.top=(w.y-(selected?20:0))+'px'; tgt.querySelector('.tag').innerHTML=tag; } else tgt.style.display='none';
});

viewer.camera.setView({destination:C.Cartesian3.fromDegrees(-99,20,18000000)});
setTimeout(()=>{const f=FLY.texas;flyTo(f[0],f[1],f[2],f[3],reduce?0:4.2);},300);
if(window.gsap&&!reduce) gsap.from('.hud',{opacity:0,y:-8,stagger:.08,duration:.6,delay:.8,ease:'power2.out'});
</script>
