<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 610" width="640" height="610" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">NSRS, cartoon edition</title>
  <desc id="d">A goofy long-necked night-shift dinosaur in a bold cartoon style, mid-stomp, with a flashing battery belly and a sparking lightning-bolt tail.</desc>
  <g stroke="#15123a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- backdrop burst -->
    <path d="M320 40 L360 120 L450 80 L430 170 L530 180 L460 250 L540 320 L440 330 L470 420 L380 380 L330 470 L290 380 L190 420 L220 330 L110 320 L190 250 L120 180 L220 170 L200 80 L290 120 Z" fill="#ffe14d" stroke-width="6"/>

    <!-- sparks from tail -->
    <path d="M48 250 L28 232" fill="none"/><path d="M42 290 L14 292" fill="none"/><path d="M60 214 L52 188" fill="none"/>

    <!-- tail -->
    <path d="M190 380 C130 390 90 350 78 300" fill="none" stroke-width="44" stroke="#15123a"/>
    <path d="M190 380 C130 390 90 350 78 300" fill="none" stroke-width="30" stroke="#ff7a1a"/>
    <!-- tail bolt -->
    <path d="M88 232 L52 282 L78 282 L60 322 L112 262 L86 262 L104 232 Z" fill="#fff36b"/>

    <!-- back legs -->
    <path d="M200 400 L196 486 Q196 500 212 500 L246 500 Q260 500 258 486 L254 400 Z" fill="#e05a0c"/>
    <path d="M350 400 L352 470 Q352 484 368 484 L402 484 Q416 484 414 470 L408 400 Z" fill="#e05a0c"/>

    <!-- body -->
    <ellipse cx="300" cy="360" rx="150" ry="90" fill="#ff7a1a"/>
    <!-- spots -->
    <circle cx="190" cy="340" r="14" fill="#ffb14d" stroke-width="5"/>
    <circle cx="250" cy="296" r="9" fill="#ffb14d" stroke-width="5"/>
    <circle cx="380" cy="300" r="11" fill="#ffb14d" stroke-width="5"/>

    <!-- front legs: one planted, one mid-stomp -->
    <path d="M250 410 L248 494 Q248 508 264 508 L300 508 Q314 508 312 494 L306 410 Z" fill="#ff7a1a"/>
    <path d="M400 392 L436 452 Q444 466 458 460 L486 446 Q498 438 490 426 L452 376 Z" fill="#ff7a1a"/>
    <!-- stomp dust -->
    <path d="M500 486 q10 -16 24 -6 q14 -12 22 6" fill="#fff" stroke-width="5"/>
    <path d="M458 500 q8 -12 20 -4" fill="none" stroke-width="5"/>

    <!-- battery belly (flashing) -->
    <rect x="226" y="318" width="136" height="62" rx="16" fill="#15123a"/>
    <rect x="362" y="336" width="12" height="26" rx="4" fill="#15123a"/>
    <g stroke="none">
      <rect x="238" y="330" width="26" height="38" rx="6" fill="#3cf08a"><animate attributeName="opacity" values="1;.35;1" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="270" y="330" width="26" height="38" rx="6" fill="#3cf08a"><animate attributeName="opacity" values="1;.35;1" dur="1.2s" begin=".15s" repeatCount="indefinite"/></rect>
      <rect x="302" y="330" width="26" height="38" rx="6" fill="#3cf08a"><animate attributeName="opacity" values="1;.35;1" dur="1.2s" begin=".3s" repeatCount="indefinite"/></rect>
      <rect x="334" y="330" width="18" height="38" rx="6" fill="#3cf08a" opacity=".3"/>
    </g>

    <!-- neck -->
    <path d="M390 300 C440 240 440 180 446 140" fill="none" stroke-width="72" stroke="#15123a"/>
    <path d="M390 300 C440 240 440 180 446 140" fill="none" stroke-width="58" stroke="#ff7a1a"/>

    <!-- head -->
    <path d="M400 130 Q404 70 470 70 Q560 72 566 128 Q570 176 500 182 Q420 186 400 130 Z" fill="#ff7a1a"/>
    <!-- huge grin -->
    <path d="M452 142 Q510 196 560 132 Q540 156 452 142 Z" fill="#15123a"/>
    <path d="M470 148 Q505 178 540 146" fill="#ff4f7a" stroke-width="4"/>
    <path d="M470 146 L478 156 L486 148 L494 158 L502 149 L510 158 L518 148 L526 156 L534 146" fill="#fff" stroke-width="3"/>
    <!-- nostrils -->
    <circle cx="548" cy="110" r="4" fill="#15123a" stroke="none"/><circle cx="534" cy="104" r="3.5" fill="#15123a" stroke="none"/>
    <!-- googly eyes -->
    <circle cx="444" cy="92" r="22" fill="#fff"/>
    <circle cx="486" cy="86" r="19" fill="#fff"/>
    <circle cx="452" cy="96" r="9" fill="#15123a" stroke="none"/>
    <circle cx="480" cy="84" r="8" fill="#15123a" stroke="none"/>
    <circle cx="455" cy="92" r="3" fill="#fff" stroke="none"/>
    <circle cx="483" cy="81" r="2.5" fill="#fff" stroke="none"/>
    <!-- headlamp -->
    <path d="M414 70 Q440 44 486 50" fill="none" stroke-width="10"/>
    <circle cx="446" cy="50" r="13" fill="#fff36b"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text x="320" y="596" font-size="54" fill="#15123a" stroke="#15123a" stroke-width="12" stroke-linejoin="round" letter-spacing="6">NSRS!</text>
    <text x="320" y="596" font-size="54" fill="#3cf08a" letter-spacing="6">NSRS!</text>
  </g>
</svg>
