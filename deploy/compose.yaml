# docker compose -f deploy/compose.yaml up -d --build
# Settings come from ../.env (copy ../.env.example); GM_ENV_FILE overrides the path.
x-env: &env
  env_file:
    - path: ${GM_ENV_FILE:-../.env}
      required: false

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  app:
    <<: [*env, *hardening]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:${GRIDMARKET_PORT:-8000}:8000"
    volumes:
      - gm-data:/data

  bots:
    <<: [*env, *hardening]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "gridmarket_server.bots"]
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/proc/1/cmdline').read_bytes().split(bytes([0]))[:3] == [b'python', b'-m', b'gridmarket_server.bots']"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - gm-data:/data
    depends_on:
      app:
        condition: service_healthy

  # Owner action only: docker compose -f deploy/compose.yaml --profile tunnel up -d
  # Mounts the owner's named-tunnel directory (config.yml + credentials JSON) read-only.
  cloudflared:
    <<: *hardening
    profiles: [tunnel]
    image: cloudflare/cloudflared:2025.9.1
    user: "${GM_TUNNEL_UID:-65532}"
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ${GM_TUNNEL_DIR:-${HOME}/.cloudflared}:/etc/cloudflared:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  gm-data:
