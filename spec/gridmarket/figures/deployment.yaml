class: F4
title: Deployment and trust boundaries
max_width: 1400
max_height: 900
direction: TB
nodes:
  - id: internet
    label: Internet clients
  - id: edge
    label: Cloudflare edge
  - id: cloudflared
    label: cloudflared (profile tunnel)
  - id: app
    label: app container, uid 10001, read-only
  - id: bots
    label: bots container, read-only
  - id: volume
    label: gm-data volume (SQLite)
  - id: loopback
