<svg xmlns="http://www.w3.org/2000/svg" width="614.5" height="408" viewBox="0 0 614.5 408" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Deployment and trust boundaries</title>
  <defs>
