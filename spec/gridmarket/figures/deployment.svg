    <text x="416" y="328.5" text-anchor="middle">x-gridmarket-key</text>
  </g>
  <g class="line" data-id="edge-6">
    <polyline points="314.5,222.18 314.5,232.81 314.5,246.69 314.5,258.8 314.5,268.85" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="339" y="245.5" text-anchor="middle">public API</text>
