<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Judge sandbox onboarding sequence</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="530" fill="white" />
  <g class="line" data-id="life-judge">
    <polyline points="80,60 80,510" fill="none" stroke="black" stroke-dasharray="4 4" />
  </g>
  <g class="line" data-id="life-page">
    <polyline points="280,60 280,510" fill="none" stroke="black" stroke-dasharray="4 4" />
  </g>
  <g class="line" data-id="life-api">
    <polyline points="480,60 480,510" fill="none" stroke="black" stroke-dasharray="4 4" />
  </g>
  <g class="line" data-id="life-market">
    <polyline points="680,60 680,510" fill="none" stroke="black" stroke-dasharray="4 4" />
  </g>
  <g class="line" data-id="life-feed">
    <polyline points="880,60 880,510" fill="none" stroke="black" stroke-dasharray="4 4" />
  </g>
  <g class="line" data-id="msg-1">
    <polyline points="80,110 280,110" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="180" y="106" text-anchor="middle">Get a sandbox key</text>
  </g>
  <g class="line" data-id="msg-2">
    <polyline points="280,160 480,160" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="380" y="156" text-anchor="middle">POST /v1/sandbox/keys</text>
  </g>
  <g class="line" data-id="msg-3">
    <polyline points="480,210 280,210" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="380" y="206" text-anchor="middle">key shown once</text>
  </g>
  <g class="line" data-id="msg-4">
    <polyline points="80,260 280,260" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="180" y="256" text-anchor="middle">Place a first order</text>
  </g>
  <g class="line" data-id="msg-5">
    <polyline points="280,310 480,310" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="380" y="306" text-anchor="middle">POST /v1/orders</text>
  </g>
  <g class="line" data-id="msg-6">
    <polyline points="480,360 680,360" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="580" y="356" text-anchor="middle">risk, match, ledger</text>
  </g>
  <g class="line" data-id="msg-7">
    <polyline points="680,410 880,410" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="780" y="406" text-anchor="middle">event appended</text>
  </g>
  <g class="line" data-id="msg-8">
    <polyline points="280,460 480,460" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="380" y="456" text-anchor="middle">GET /v1/orders every 2 s</text>
  </g>
  <g id="judge">
    <rect x="20" y="20" width="120" height="40" fill="white" stroke="black" />
    <text x="80" y="44" text-anchor="middle">Judge</text>
  </g>
  <g id="page">
    <rect x="220" y="20" width="120" height="40" fill="white" stroke="black" />
    <text x="280" y="44" text-anchor="middle">Sandbox page</text>
  </g>
  <g id="api">
    <rect x="420" y="20" width="120" height="40" fill="white" stroke="black" />
    <text x="480" y="44" text-anchor="middle">api.py</text>
  </g>
  <g id="market">
    <rect x="620" y="20" width="120" height="40" fill="white" stroke="black" />
    <text x="680" y="44" text-anchor="middle">market.py</text>
  </g>
  <g id="feed">
    <rect x="820" y="20" width="120" height="40" fill="white" stroke="black" />
    <text x="880" y="44" text-anchor="middle">Activity feed</text>
  </g>
</svg>
