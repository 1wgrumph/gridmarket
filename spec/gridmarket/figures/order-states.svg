<svg xmlns="http://www.w3.org/2000/svg" width="838" height="194" viewBox="0 0 838 194" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Order state machine</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
  <rect x="0" y="0" width="838" height="194" fill="white" />
  <g class="line" data-id="edge-1">
    <polyline points="101.571,97.931 110.097,94.002 119.265,90.099 128,87 160.58,75.44 197.12,65.53 229.78,57.71 239.78,55.35" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="175" y="55.5" text-anchor="middle">auth, limit, risk fail</text>
  </g>
  <g class="line" data-id="edge-2">
    <polyline points="110.144,111.902 150.85,108.122 211.83,102.461 258.35,98.141 268.35,97.213" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="175" y="96.5" text-anchor="middle">no cross</text>
  </g>
  <g class="line" data-id="edge-3">
    <polyline points="110.291,120.321 145.43,123.565 195.81,127.811 240,130 329.44,134.43 433.04,135.663 497.81,135.966 507.86,136.008" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="325.5" y="124.5" text-anchor="middle">partial cross</text>
  </g>
  <g class="line" data-id="edge-4">
    <polyline points="110.136,129.193 116.101,130.655 122.17,131.981 128,133 342.05,170.448 398.76,167.825 616,163 656.44,162.102 702.68,159.908 734.55,158.213 744.77,157.66" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="459.5" y="159.5" text-anchor="middle">full cross</text>
  </g>
  <g class="line" data-id="edge-5">
    <polyline points="382.67,102.539 417.35,109.046 461.92,117.409 497.82,124.146 507.71,126" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="459.5" y="106.5" text-anchor="middle">incoming fill</text>
  </g>
  <g class="line" data-id="edge-6">
    <polyline points="382.51,91.801 457.7,91.645 595.43,91.753 713,94 715.53,94.048 718.12,94.105 720.73,94.169 730.87,94.442" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="562" y="86.5" text-anchor="middle">DELETE or close</text>
  </g>
  <g class="line" data-id="edge-7">
    <polyline points="616.12,141.047 652.93,144.545 701.14,149.125 734.45,152.29 744.71,153.264" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="673.5" y="138.5" text-anchor="middle">remaining filled</text>
  </g>
  <g class="line" data-id="edge-8">
    <polyline points="616.12,125.906 648.21,119.808 688.95,112.066 720.94,105.988 731,104.077" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="673.5" y="102.5" text-anchor="middle">DELETE or close</text>
  </g>
  <g id="submitted">
    <rect x="20" y="98" width="90" height="36" fill="white" stroke="black" />
    <text x="65" y="120" text-anchor="middle">Submitted</text>
  </g>
  <g id="rejected">
    <rect x="240" y="20" width="171" height="36" fill="white" stroke="black" />
    <text x="325.5" y="42" text-anchor="middle">Rejected (typed reason)</text>
  </g>
  <g id="open">
    <rect x="268.501" y="74" width="113.998" height="36" fill="white" stroke="black" />
    <text x="325.5" y="96" text-anchor="middle">Open (resting)</text>
  </g>
  <g id="partial">
    <rect x="508" y="118" width="108" height="36" fill="white" stroke="black" />
    <text x="562" y="140" text-anchor="middle">Partially filled</text>
  </g>
  <g id="filled">
    <rect x="745" y="138" width="58.9997" height="36" fill="white" stroke="black" />
    <text x="774.5" y="160" text-anchor="middle">Filled</text>
  </g>
  <g id="cancelled">
    <rect x="731.001" y="78" width="86.9976" height="36" fill="white" stroke="black" />
    <text x="774.5" y="100" text-anchor="middle">Cancelled</text>
  </g>
</svg>
