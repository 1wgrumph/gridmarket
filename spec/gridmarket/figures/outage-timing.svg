<svg xmlns="http://www.w3.org/2000/svg" width="770" height="230" viewBox="0 0 770 230" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>ERCOT Worker outage and recovery (minutes)</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
  <rect x="0" y="0" width="770" height="230" fill="white" />
  <g id="worker">
    <rect x="20" y="20" width="120" height="40" fill="white" stroke="black" />
    <text x="80" y="44" text-anchor="middle">ERCOT Worker</text>
  </g>
  <g id="worker-s1">
    <rect x="150" y="20" width="109.091" height="40" fill="white" stroke="black" />
    <text x="204.545" y="44" text-anchor="middle">up</text>
  </g>
  <g id="worker-s2">
    <rect x="259.091" y="20" width="254.545" height="40" fill="white" stroke="black" />
    <text x="386.364" y="44" text-anchor="middle">failing (5xx)</text>
  </g>
  <g id="worker-s3">
    <rect x="513.636" y="20" width="236.364" height="40" fill="white" stroke="black" />
    <text x="631.818" y="44" text-anchor="middle">up</text>
  </g>
  <g id="client">
    <rect x="20" y="70" width="120" height="40" fill="white" stroke="black" />
    <text x="80" y="94" text-anchor="middle">Market client</text>
  </g>
  <g id="client-s1">
    <rect x="150" y="70" width="109.091" height="40" fill="white" stroke="black" />
    <text x="204.545" y="94" text-anchor="middle">poll 5 min</text>
  </g>
  <g id="client-s2">
    <rect x="259.091" y="70" width="254.545" height="40" fill="white" stroke="black" />
    <text x="386.364" y="94" text-anchor="middle">backoff 5 s to 300 s</text>
  </g>
  <g id="client-s3">
    <rect x="513.636" y="70" width="236.364" height="40" fill="white" stroke="black" />
    <text x="631.818" y="94" text-anchor="middle">poll 5 min</text>
  </g>
  <g id="served">
    <rect x="20" y="120" width="120" height="40" fill="white" stroke="black" />
    <text x="80" y="144" text-anchor="middle">Served values</text>
  </g>
  <g id="served-s1">
    <rect x="150" y="120" width="181.818" height="40" fill="white" stroke="black" />
    <text x="240.909" y="144" text-anchor="middle">fresh</text>
  </g>
  <g id="served-s2">
    <rect x="331.818" y="120" width="227.273" height="40" fill="white" stroke="black" />
    <text x="445.455" y="144" text-anchor="middle">stale with age_s</text>
  </g>
  <g id="served-s3">
    <rect x="559.091" y="120" width="190.909" height="40" fill="white" stroke="black" />
    <text x="654.545" y="144" text-anchor="middle">fresh</text>
  </g>
  <g id="api">
    <rect x="20" y="170" width="120" height="40" fill="white" stroke="black" />
    <text x="80" y="194" text-anchor="middle">API endpoints</text>
  </g>
  <g id="api-s1">
    <rect x="150" y="170" width="545.455" height="40" fill="white" stroke="black" />
    <text x="422.727" y="194" text-anchor="middle">answering</text>
  </g>
  <g id="api-s2">
    <rect x="695.455" y="170" width="54.5455" height="40" fill="white" stroke="black" />
    <text x="722.727" y="194" text-anchor="middle">answering</text>
  </g>
</svg>
